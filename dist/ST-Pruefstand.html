<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ST Prüfstand</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Leitstand – Bedienleiste mit Arbeitsbereichen und CPU-LEDs oben;
   Simulation = Ablaufplan links, Bedienfeld rechts; Code = Editor + Meldungen; Tests = Ergebnisliste */
:root {
  --bg: #e7e8e3;        /* Schaltschrank-Grau (RAL 7035-nah) */
  --surface: #f6f6f2;
  --surface-2: #eeefea;
  --ink: #1d2225;
  --muted: #5d666b;
  --line: #c8cbc4;
  --accent: #1d5d8a;    /* Signalblau */
  --accent-ink: #ffffff;
  --ok: #23863a;
  --ok-soft: rgba(35, 134, 58, 0.14);
  --bad: #c22d2d;
  --warn: #b86e00;
  --warn-soft: rgba(184, 110, 0, 0.12);
  --force: #8a3fa0;
  --sel: rgba(29, 93, 138, 0.12);
  --err-line: rgba(194, 45, 45, 0.10);
  --step-active: #1d5d8a;
  --hl-kw: #1d5d8a;
  --hl-type: #7a3f93;
  --hl-num: #a14f00;
  --hl-str: #2b7346;
  --hl-cmt: #7d868a;
  --hl-test: #b0461b;
  --font-ui: "Barlow", "Segoe UI", system-ui, sans-serif;
  --font-label: "Barlow Semi Condensed", "Barlow", "Arial Narrow", sans-serif;
  --font-code: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --code-size: 13px;
  --code-lh: 20px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15181a; --surface: #1c2023; --surface-2: #23282b; --ink: #e2e5e1; --muted: #98a0a4; --line: #343a3e;
    --accent: #5ea9dc; --accent-ink: #0d1316; --ok: #4cc069; --ok-soft: rgba(76, 192, 105, 0.16); --bad: #f06060;
    --warn: #e6a23c; --warn-soft: rgba(230, 162, 60, 0.14); --force: #c58ee0;
    --sel: rgba(94, 169, 220, 0.16); --err-line: rgba(240, 96, 96, 0.13); --step-active: #3d8fc7;
    --hl-kw: #6db3e4; --hl-type: #c99ae0; --hl-num: #e9a35a; --hl-str: #7fcf98; --hl-cmt: #6f797e; --hl-test: #f08a5d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15181a; --surface: #1c2023; --surface-2: #23282b; --ink: #e2e5e1; --muted: #98a0a4; --line: #343a3e;
  --accent: #5ea9dc; --accent-ink: #0d1316; --ok: #4cc069; --ok-soft: rgba(76, 192, 105, 0.16); --bad: #f06060;
  --warn: #e6a23c; --warn-soft: rgba(230, 162, 60, 0.14); --force: #c58ee0;
  --sel: rgba(94, 169, 220, 0.16); --err-line: rgba(240, 96, 96, 0.13); --step-active: #3d8fc7;
  --hl-kw: #6db3e4; --hl-type: #c99ae0; --hl-num: #e9a35a; --hl-str: #7fcf98; --hl-cmt: #6f797e; --hl-test: #f08a5d;
  color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 14px; margin: 0; }
* { box-sizing: border-box; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
code { font-family: var(--font-code); font-size: 0.92em; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: auto 1fr auto;
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}

/* ---------- Bedienleiste ---------- */
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.brand h1 { font-family: var(--font-label); font-weight: 700; font-size: 19px; letter-spacing: 0.02em; margin: 0; white-space: nowrap; }

.modes { display: flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 6px; padding: 2px; }
.mode-tab {
  border: 0; background: none; padding: 5px 14px; border-radius: 4px; cursor: pointer;
  font-family: var(--font-label); font-weight: 600; font-size: 14.5px; color: var(--muted);
  display: flex; align-items: center; gap: 6px;
}
.mode-tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
.mode-tab[aria-selected="true"] .count { background: var(--accent-ink); color: var(--accent); }

.leds { display: flex; gap: 10px; padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); }
.led { display: flex; align-items: center; gap: 5px; font-family: var(--font-label); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; color: var(--muted); }
.led i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.led.on.run i { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.led.on.stop i { background: var(--warn); box-shadow: 0 0 6px var(--warn); }
.led.on.sf i { background: var(--bad); box-shadow: 0 0 6px var(--bad); }
.led.on { color: var(--ink); }

.group { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--surface-2);
  padding: 5px 11px; border-radius: 4px; cursor: pointer; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.small { padding: 2px 8px; font-size: 12.5px; }
.btn.icon { width: 26px; padding: 2px 0; font-weight: 700; }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.field { display: flex; align-items: center; gap: 6px; font-family: var(--font-label); font-size: 12.5px; color: var(--muted); }
.field input, .field select, .mini-select {
  padding: 4px 6px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); color: var(--ink);
}
.field input { width: 54px; font-family: var(--font-code); font-size: 12.5px; }
.mini-select { font-size: 12.5px; padding: 2px 4px; max-width: 220px; }
.clock { font-family: var(--font-code); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); display: flex; gap: 12px; }
.clock b { color: var(--ink); font-weight: 500; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.count { font-family: var(--font-code); font-size: 11px; padding: 0 5px; border-radius: 8px; background: var(--line); color: var(--ink); }
.count.bad { background: var(--bad); color: #fff; }
.count.ok { background: var(--ok); color: #fff; }
.count.warn { background: var(--warn); color: #fff; }

/* ---------- Arbeitsbereiche ---------- */
.modes-host { min-height: 0; position: relative; }
.mode-view { position: absolute; inset: 0; display: grid; min-height: 0; }
.mode-view[hidden] { display: none !important; }
.code-mode { grid-template-columns: minmax(0, 1fr) minmax(280px, 380px); }
.sim-mode { grid-template-columns: minmax(0, 1fr) minmax(300px, 400px); }
.tests-mode { grid-template-columns: minmax(0, 1fr); }
.pane { display: grid; grid-template-rows: auto 1fr; min-height: 0; min-width: 0; background: var(--surface); }
.pane.side, .pane.panel { border-left: 1px solid var(--line); }
.tabs { display: flex; align-items: stretch; background: var(--surface-2); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
.tab {
  border: 0; background: none; padding: 9px 14px 8px; cursor: pointer;
  font-family: var(--font-label); font-weight: 600; font-size: 13.5px; letter-spacing: 0.02em; color: var(--muted);
  border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; gap: 7px;
}
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); background: var(--surface); }
.tabs .tools { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 0 10px; }
.view { min-height: 0; min-width: 0; position: relative; background: var(--surface); }
.view[hidden] { display: none !important; }
.scroll { position: absolute; inset: 0; overflow: auto; }

/* ---------- Editor ---------- */
.editor { position: absolute; inset: 0; display: grid; grid-template-columns: auto 1fr; overflow: hidden; }
.gutter {
  font-family: var(--font-code); font-size: var(--code-size); line-height: var(--code-lh);
  color: var(--muted); text-align: right; padding: 10px 8px 40px 12px; background: var(--surface-2);
  border-right: 1px solid var(--line); overflow: hidden; user-select: none; font-variant-numeric: tabular-nums; min-width: 48px;
}
.gutter div { position: relative; }
.gutter .e { color: var(--bad); font-weight: 700; }
.gutter .w { color: var(--warn); font-weight: 700; }
.gutter .e::before, .gutter .w::before { content: ""; position: absolute; left: -8px; top: 6px; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.code-wrap { position: relative; overflow: hidden; }
.code-wrap pre, .code-wrap textarea {
  position: absolute; inset: 0; margin: 0; padding: 10px 14px 40px;
  font-family: var(--font-code); font-size: var(--code-size); line-height: var(--code-lh);
  white-space: pre; tab-size: 4; overflow: auto; border: 0; font-variant-ligatures: none;
}
.code-wrap pre { pointer-events: none; color: var(--ink); overflow: hidden; }
.code-wrap textarea { background: transparent; color: transparent; caret-color: var(--ink); resize: none; outline: none; }
.code-wrap textarea::selection { background: var(--sel); color: transparent; }
.hl-kw { color: var(--hl-kw); font-weight: 600; }
.hl-type { color: var(--hl-type); }
.hl-num { color: var(--hl-num); }
.hl-str { color: var(--hl-str); }
.hl-cmt { color: var(--hl-cmt); font-style: italic; }
.hl-test { color: var(--hl-test); font-weight: 700; }

/* ---------- Meldungen ---------- */
.diags { list-style: none; margin: 0; padding: 0; }
.diags li { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 2px 10px; padding: 8px 12px; border-bottom: 1px solid var(--surface-2); cursor: pointer; }
.diags li:hover { background: var(--surface-2); }
.diags .k { font-family: var(--font-label); font-weight: 700; font-size: 12px; letter-spacing: 0.05em; text-transform: uppercase; }
.diags .k.error { color: var(--bad); } .diags .k.warning { color: var(--warn); } .diags .k.info { color: var(--ok); }
.diags .where { font-family: var(--font-code); font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.diags .msg { grid-column: 1 / 3; min-width: 0; word-break: break-word; line-height: 1.4; }

/* ---------- Ablaufplan ---------- */
.chart-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding: 8px 14px;
  background: var(--surface-2); border-bottom: 1px solid var(--line);
}
.chart-head h2 { font-family: var(--font-label); font-size: 15px; font-weight: 700; margin: 0; letter-spacing: 0.02em; white-space: nowrap; }
.hist { display: flex; align-items: center; gap: 4px; font-family: var(--font-code); font-size: 12px; color: var(--muted); min-width: 0; overflow: hidden; flex: 1; white-space: nowrap; }
.hist .hs { padding: 0 6px; border-radius: 3px; background: var(--surface); border: 1px solid var(--line); }
.hist .hs.cur { background: var(--step-active); border-color: var(--step-active); color: #fff; }
.zoom { display: flex; align-items: center; gap: 4px; }
.zoom .check { margin-right: 6px; }
.chart-scroll { position: relative; overflow: auto; min-height: 0; background:
  radial-gradient(circle, var(--line) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--surface); }
.chart-stage { position: relative; transform-origin: 0 0; }
.chart-canvas { position: relative; }
.chart-canvas svg { position: absolute; left: 0; top: 0; overflow: visible; }
.chart-canvas svg .ln { stroke: var(--ink); stroke-width: 1.6; fill: none; }
.chart-canvas svg .ln.dim { stroke: var(--muted); }
.chart-canvas svg .bar { stroke: var(--ink); stroke-width: 3.5; }
.chart-canvas svg .bar.wait { stroke: var(--warn); }
.chart-canvas svg .bar.go { stroke: var(--ok); }
.chart-canvas svg .arrow { fill: var(--ink); }

.step {
  position: absolute; display: grid; place-items: center; border: 2px solid var(--ink); background: var(--surface);
  font-family: var(--font-label); font-weight: 700; font-size: 19px; border-radius: 2px; cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.step.init { box-shadow: inset 0 0 0 3px var(--surface), inset 0 0 0 5px var(--ink); }
.step.active { background: var(--step-active); color: #fff; border-color: var(--step-active); box-shadow: 0 0 0 4px var(--sel); }
.step.active.init { box-shadow: inset 0 0 0 3px var(--step-active), inset 0 0 0 5px #fff, 0 0 0 4px var(--sel); }
.step .since { position: absolute; top: 100%; margin-top: 3px; font-family: var(--font-code); font-size: 10.5px; font-weight: 400; color: var(--step-active); white-space: nowrap; }
.step:not(.active) .since { display: none; }
.from-hint { position: absolute; font-size: 11.5px; color: var(--muted); white-space: nowrap; font-family: var(--font-label); }

.act {
  position: absolute; border: 1.5px solid var(--ink); background: var(--surface); font-size: 12.5px;
  display: grid; grid-auto-rows: min-content; padding: 4px 0;
}
.act.active { border-color: var(--step-active); box-shadow: 0 0 0 3px var(--sel); }
.act .arow { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 6px; padding: 1px 8px; align-items: baseline; }
.act .q { font-family: var(--font-label); font-weight: 700; color: var(--muted); }
.act .an { font-family: var(--font-code); font-size: 12px; line-height: 1.5; overflow-wrap: anywhere; }
.act .an .lamp { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-right: 5px; vertical-align: 1px; }
.act .an .lamp.on { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
.act .an .out { color: var(--muted); }
.act .entry { font-family: var(--font-code); font-size: 11.5px; color: var(--muted); white-space: normal; line-height: 1.35; }

.cond {
  position: absolute; font-family: var(--font-code); font-size: 12px; line-height: 1.55; max-width: 230px;
  padding: 1px 4px; border-radius: 3px;
}
.cond.left { text-align: right; }
.cond.go { background: var(--ok-soft); }
.cond.wait { background: var(--warn-soft); }
.cond .op { color: var(--muted); }
.chip {
  border: 1px solid var(--line); background: var(--surface); border-radius: 3px; padding: 0 4px; cursor: pointer;
  font-family: var(--font-code); font-size: 12px; line-height: 1.35; display: inline-flex; align-items: center; gap: 4px;
}
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.chip.t::before { background: var(--ok); box-shadow: 0 0 4px var(--ok); }
.chip.num::before { display: none; }
.chip.num { cursor: default; }
.chip .v { color: var(--accent-ink); background: var(--accent); border-radius: 2px; padding: 0 4px; font-size: 11px; margin-right: -2px; }
.chip .v:empty { display: none; }
.chip:hover:not(.num) { border-color: var(--accent); }
.chip.ro { cursor: default; }
.jump { position: absolute; font-family: var(--font-label); font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.gtrans { position: absolute; left: 16px; top: 12px; border: 1px dashed var(--muted); padding: 6px 10px; background: var(--surface); font-size: 12.5px; max-width: 340px; }
.gtrans b { font-family: var(--font-label); }
.gtrans.go { border-color: var(--ok); background: var(--ok-soft); }
.chart-empty { padding: 28px 22px; color: var(--muted); max-width: 62ch; line-height: 1.55; }
.chart-empty code { background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }

/* ---------- Bedienfeld ---------- */
.panel { grid-template-rows: 1fr; }
.panel-scroll { overflow: auto; min-height: 0; }
.pblock { padding: 12px 14px; border-bottom: 1px solid var(--line); }
.pblock h3 { font-family: var(--font-label); font-size: 12.5px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.pblock h3 .sub { text-transform: none; letter-spacing: 0; font-weight: 500; font-size: 12px; }
details.pblock summary { cursor: pointer; list-style: none; }
details.pblock summary::-webkit-details-marker { display: none; }
details.pblock summary h3 { margin: 0; }
details.pblock summary h3::before { content: "▸"; }
details.pblock[open] summary h3::before { content: "▾"; }
details.pblock[open] summary { margin-bottom: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin-bottom: 8px; }
.seg button { border: 0; background: var(--surface-2); padding: 6px 8px; cursor: pointer; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button:disabled { opacity: 0.45; cursor: default; }
.hint { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.hint:empty { display: none; }

.io { display: grid; gap: 2px; }
.iorow { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 3px 4px; border-radius: 4px; }
.iorow:hover { background: var(--surface-2); }
.iorow .nm { min-width: 0; display: flex; flex-direction: column; }
.iorow .nm b { font-family: var(--font-code); font-weight: 500; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iorow .nm span { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.iorow.forced .nm b { color: var(--force); }
.iorow.forced .nm b::after { content: " · festgehalten"; font-family: var(--font-ui); font-size: 11px; font-weight: 600; }
.iorow.forced .sw.t { border-color: var(--force); }
.sw {
  width: 38px; height: 22px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2);
  position: relative; cursor: pointer; padding: 0; flex: none;
}
.sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: left 0.12s, background 0.12s; }
.sw.t { background: var(--ok-soft); border-color: var(--ok); }
.sw.t::after { left: 18px; background: var(--ok); }
.lampbig { width: 16px; height: 16px; border-radius: 50%; background: var(--line); margin: 0 11px; flex: none; }
.lampbig.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.tbtn { border: 1px solid var(--line); background: none; border-radius: 4px; font-size: 12px; padding: 1px 7px; cursor: pointer; color: var(--muted); touch-action: none; }
.tbtn.rel { color: var(--force); border-color: var(--force); font-weight: 600; }
.tbtn.on { background: var(--ok); border-color: var(--ok); color: #fff; }
.iorow .val { font-family: var(--font-code); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { .sw::after, .step { transition: none; } }

/* ---------- Variablen-Tabelle ---------- */
.watch-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
.watch-tools input[type=search] { flex: 1; min-width: 0; padding: 4px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); }
.watch { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
.watch td { padding: 2px 6px; border-bottom: 1px solid var(--surface-2); vertical-align: middle; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.watch tr:hover td { background: var(--surface-2); }
.watch .name { font-family: var(--font-code); font-size: 12px; }
.watch .name .tw { display: inline-block; width: 14px; cursor: pointer; color: var(--muted); text-align: center; }
.watch .type { font-family: var(--font-label); color: var(--muted); font-size: 12px; }
.watch .val { font-family: var(--font-code); font-size: 12px; font-variant-numeric: tabular-nums; }
.watch .actc { text-align: right; }
.watch tr.group-row td { background: var(--surface-2); font-family: var(--font-label); font-weight: 700; letter-spacing: 0.04em; padding-top: 6px; padding-bottom: 4px; }
.watch tr.group-row .badge { font-weight: 600; font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); margin-left: 6px; }
.bool { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: 0; background: none; padding: 1px 4px; border-radius: 3px; font-family: var(--font-code); font-size: 12px; }
.bool i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); }
.bool.t i { background: var(--ok); box-shadow: 0 0 5px var(--ok); }
.bool:hover { background: var(--sel); }
.num { cursor: text; padding: 1px 4px; border-radius: 3px; border: 1px dashed transparent; }
.num:hover { border-color: var(--line); }
.val input { width: 100%; font-family: var(--font-code); font-size: 12px; padding: 1px 4px; border: 1px solid var(--accent); border-radius: 3px; background: var(--surface); }
.forced .val { color: var(--force); }
.fbtn { border: 1px solid var(--line); background: none; border-radius: 3px; font-size: 10.5px; font-weight: 700; padding: 0 5px; cursor: pointer; color: var(--muted); font-family: var(--font-label); letter-spacing: 0.06em; }
.fbtn.on { background: var(--force); border-color: var(--force); color: #fff; }
.fbtn + .fbtn { margin-left: 3px; }
.changed { animation: flash 0.6s ease-out; }
@keyframes flash { from { background: var(--sel); } to { background: transparent; } }
@media (prefers-reduced-motion: reduce) { .changed { animation: none; } }

/* ---------- Tests ---------- */
.tests-head { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--line); }
.tests-body { overflow: auto; min-height: 0; }
.summary { font-family: var(--font-label); font-size: 15px; font-weight: 600; display: flex; gap: 12px; }
.summary .p { color: var(--ok); } .summary .f { color: var(--bad); }
.tlist { list-style: none; margin: 0; padding: 0; }
.tlist li { border-bottom: 1px solid var(--surface-2); }
.trow { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 9px 16px; cursor: pointer; }
.trow:hover { background: var(--surface-2); }
.trow.sel { background: var(--sel); }
.st { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; color: #fff; margin-top: 1px; }
.st.pass { background: var(--ok); } .st.fail { background: var(--bad); } .st.error { background: var(--warn); }
.tname { font-weight: 600; min-width: 0; }
.tmeta { font-family: var(--font-code); font-size: 11.5px; color: var(--muted); text-align: right; white-space: nowrap; }
.tmsg { grid-column: 2 / 4; font-family: var(--font-code); font-size: 12px; color: var(--bad); white-space: pre-wrap; word-break: break-word; }
.tmsg a { color: inherit; }
.tlog { grid-column: 2 / 4; font-family: var(--font-code); font-size: 11.5px; color: var(--muted); white-space: pre-wrap; }
.trace { padding: 12px 16px 24px; border-top: 1px solid var(--line); }
.trace h3 { font-family: var(--font-label); font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 4px 0 8px; font-weight: 600; }
.trace-wrap { overflow-x: auto; }
.trace svg text { font-family: var(--font-code); font-size: 11px; fill: var(--ink); }
.trace svg .lbl { fill: var(--muted); }
.empty { padding: 24px 16px; color: var(--muted); max-width: 64ch; line-height: 1.5; }

/* ---------- Hilfe ---------- */
.help { padding: 16px 18px 40px; line-height: 1.55; }
.help h2 { font-family: var(--font-label); font-size: 16px; margin: 18px 0 6px; text-wrap: balance; }
.help h2:first-child { margin-top: 0; }
.help pre { font-family: var(--font-code); font-size: 12px; background: var(--surface-2); padding: 10px 12px; border-radius: 4px; overflow-x: auto; line-height: 1.5; }
.help code { font-family: var(--font-code); font-size: 12px; background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.help table { border-collapse: collapse; font-size: 13px; }
.help td { border-bottom: 1px solid var(--line); padding: 4px 10px 4px 0; vertical-align: top; }

/* ---------- Statuszeile ---------- */
.status {
  display: flex; gap: 16px; align-items: center; padding-block: 4px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  font-size: 12px; color: var(--muted); background: var(--surface-2); border-top: 1px solid var(--line);
  font-family: var(--font-label); min-height: 26px;
}
.status .msg { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .msg.bad { color: var(--bad); font-weight: 600; }
.status .msg.ok { color: var(--ok); font-weight: 600; }

/* ---------- Schmal ---------- */
@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; min-height: 100%; }
  .modes-host { min-height: 0; }
  .mode-view { position: static; }
  .code-mode, .sim-mode { grid-template-columns: minmax(0, 1fr); grid-template-rows: 70vh auto; }
  .pane.side, .pane.panel { border-left: 0; border-top: 1px solid var(--line); }
  .side { min-height: 40vh; }
  .tests-mode { min-height: 70vh; }
}

</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><h1>ST Prüfstand</h1></div>

    <nav class="modes" role="tablist" aria-label="Arbeitsbereich">
      <button class="mode-tab" role="tab" data-mode="code" aria-selected="false">Code <span class="count" id="cntCode" hidden></span></button>
      <button class="mode-tab" role="tab" data-mode="sim" aria-selected="true">Simulation</button>
      <button class="mode-tab" role="tab" data-mode="tests" aria-selected="false">Tests <span class="count" id="cntResults" hidden></span></button>
    </nav>

    <div class="leds" title="CPU-Status">
      <div class="led run" id="ledRun"><i></i>RUN</div>
      <div class="led stop on" id="ledStop"><i></i>STOP</div>
      <div class="led sf" id="ledSf"><i></i>SF</div>
    </div>

    <div class="group">
      <button class="btn primary" id="btnCompile" title="Übersetzen und in die Simulation laden (Strg/Cmd+Enter)">
        <svg viewBox="0 0 16 16"><path d="M2 2h9l3 3v9H2V2zm2 2v8h8V6H9V4H4zm1 5h6v1H5V9zm0-2h4v1H5V7z"/></svg>Übersetzen
      </button>
      <button class="btn" id="btnRun" title="Simulation starten"><svg viewBox="0 0 16 16"><path d="M4 2l10 6-10 6V2z"/></svg>Start</button>
      <button class="btn" id="btnStop" title="Simulation anhalten"><svg viewBox="0 0 16 16"><path d="M3 3h4v10H3V3zm6 0h4v10H9V3z"/></svg>Stopp</button>
      <button class="btn" id="btnStep" title="Genau einen SPS-Zyklus ausführen"><svg viewBox="0 0 16 16"><path d="M2 3l7 5-7 5V3zm9 0h2v10h-2V3z"/></svg>1 Zyklus</button>
      <button class="btn" id="btnReset" title="Kaltstart: alle Variablen auf Initialwerte (und Grundstellung)"><svg viewBox="0 0 16 16"><path d="M8 2a6 6 0 1 1-5.6 3.9l1.8.7A4 4 0 1 0 8 4v2L4.5 3 8 0v2z"/></svg>Kaltstart</button>
    </div>

    <div class="group">
      <label class="field" for="inpCycle" title="Zykluszeit der simulierten CPU">Zyklus <input id="inpCycle" type="number" min="1" max="1000" value="10"> ms</label>
      <label class="field" for="selSpeed">Tempo
        <select id="selSpeed">
          <option value="0.1">0,1×</option><option value="0.25">0,25×</option><option value="0.5">0,5×</option>
          <option value="1" selected>1×</option><option value="2">2×</option><option value="5">5×</option>
          <option value="20">20×</option><option value="100">100×</option>
        </select>
      </label>
    </div>
  </header>

  <main class="modes-host">
    <!-- ================= CODE ================= -->
    <section class="mode-view code-mode" id="mode-code" hidden>
      <div class="pane">
        <div class="tabs" role="tablist" id="edTabs">
          <button class="tab" role="tab" data-ed="prog" aria-selected="true">Programm <span class="count" id="cntProg" hidden></span></button>
          <button class="tab" role="tab" data-ed="model" aria-selected="false">Anlagenmodell <span class="count" id="cntModel" hidden></span></button>
          <button class="tab" role="tab" data-ed="tests" aria-selected="false">Tests <span class="count" id="cntTests" hidden></span></button>
          <div class="tools">
            <select id="selExample" class="mini-select" title="Beispiel laden"><option value="">Beispiel laden…</option></select>
            <select id="selServerFile" class="mini-select" title="Datei aus dem Projektordner öffnen" hidden><option value="">Datei öffnen…</option></select>
            <button class="btn small" id="btnOpen" title="Datei in diesen Editor laden">Öffnen</button>
            <button class="btn small" id="btnCopy" title="Inhalt kopieren">Kopieren</button>
            <button class="btn small" id="btnSave" title="Speichern" hidden>Speichern</button>
            <input type="file" id="fileInput" accept=".st,.sttest,.txt,.exp" hidden>
          </div>
        </div>
        <div class="view" id="ed-prog"></div>
        <div class="view" id="ed-model" hidden></div>
        <div class="view" id="ed-tests" hidden></div>
      </div>
      <aside class="pane side">
        <div class="tabs" role="tablist" id="sideTabs">
          <button class="tab" role="tab" data-side="diags" aria-selected="true">Meldungen <span class="count" id="cntDiags" hidden></span></button>
          <button class="tab" role="tab" data-side="help" aria-selected="false">Hilfe</button>
        </div>
        <div class="view" id="side-diags"><div class="scroll"><ul class="diags" id="diagList"></ul></div></div>
        <div class="view" id="side-help" hidden><div class="scroll"><div class="help" id="helpBox"></div></div></div>
      </aside>
    </section>

    <!-- ================= SIMULATION ================= -->
    <section class="mode-view sim-mode" id="mode-sim">
      <div class="pane chart-pane">
        <div class="chart-head">
          <h2 id="chartTitle">Ablaufplan</h2>
          <select id="selChart" class="mini-select" hidden title="Schrittkette wählen"></select>
          <div class="hist" id="stepHist" aria-label="Schrittverlauf"></div>
          <div class="zoom">
            <label class="check" for="chkFollow"><input type="checkbox" id="chkFollow" checked> folgen</label>
            <button class="btn small icon" id="btnZoomOut" title="Verkleinern">−</button>
            <button class="btn small" id="btnZoomFit" title="Einpassen">Einpassen</button>
            <button class="btn small icon" id="btnZoomIn" title="Vergrößern">+</button>
          </div>
        </div>
        <div class="chart-scroll" id="chartScroll">
          <div class="chart-stage" id="chartStage"></div>
        </div>
      </div>

      <aside class="pane panel">
        <div class="panel-scroll">
          <section class="pblock">
            <h3>Sensoren</h3>
            <div class="seg" role="radiogroup" aria-label="Sensorquelle">
              <button role="radio" id="srcManual" aria-checked="true">Manuell schalten</button>
              <button role="radio" id="srcModel" aria-checked="false">Anlagenmodell</button>
            </div>
            <label class="check" for="chkSetup"><input type="checkbox" id="chkSetup" checked> Grundstellung aus <code>SETUP</code> der Testdatei</label>
            <p class="hint" id="srcHint"></p>
          </section>

          <section class="pblock">
            <h3>Eingänge <span class="sub">klicken = umschalten · <b>⏺</b> halten = Taster</span></h3>
            <div class="io" id="ioIn"></div>
          </section>

          <section class="pblock" id="sigBlock" hidden>
            <h3>Interne Signale <span class="sub">vom Programm berechnet · Schalter hält den Wert fest</span></h3>
            <div class="io" id="ioSig"></div>
          </section>

          <section class="pblock">
            <h3>Ausgänge</h3>
            <div class="io" id="ioOut"></div>
          </section>

          <details class="pblock" id="allVars">
            <summary><h3>Alle Variablen</h3></summary>
            <div class="watch-tools">
              <input type="search" id="watchFilter" placeholder="filtern, z.B. iStep, fbBetriebsart">
              <button class="btn small" id="btnUnforce" title="Alle Forcings aufheben">Forcen aufheben</button>
            </div>
            <table class="watch"><colgroup><col style="width:42%"><col style="width:92px"><col><col style="width:84px"></colgroup><tbody id="watchBody"></tbody></table>
          </details>
        </div>
      </aside>
    </section>

    <!-- ================= TESTS ================= -->
    <section class="mode-view tests-mode" id="mode-tests" hidden>
      <div class="pane">
        <div class="tests-head">
          <button class="btn primary" id="btnTests">Alle Tests ausführen</button>
          <button class="btn" id="btnEditTests" title="Testdatei im Code-Bereich öffnen">Testdatei bearbeiten</button>
          <label class="check" for="chkTrace"><input type="checkbox" id="chkTrace" checked> Zeitdiagramm aufzeichnen</label>
          <div class="summary" id="testSummary"></div>
        </div>
        <div class="tests-body">
          <ul class="tlist" id="testList"></ul>
          <div class="trace" id="traceBox" hidden></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="status">
    <div class="msg" id="statusMsg">Bereit.</div>
    <div class="clock"><span>t = <b id="simTime">0 ms</b></span><span>Zyklen <b id="cycCount">0</b></span></div>
    <div id="cursorPos"></div>
  </footer>
</div>

<script>
// ST Lexer – IEC 61131-3 Structured Text (CODESYS-Dialekt)
(function (ST) {
  'use strict';

  class STError extends Error {
    constructor(msg, line, col, kind) {
      super(msg);
      this.line = line || 0;
      this.col = col || 0;
      this.kind = kind || 'error';
    }
  }

  const KEYWORDS = new Set([
    'PROGRAM', 'END_PROGRAM', 'FUNCTION_BLOCK', 'END_FUNCTION_BLOCK', 'FUNCTION', 'END_FUNCTION',
    'VAR', 'VAR_INPUT', 'VAR_OUTPUT', 'VAR_IN_OUT', 'VAR_TEMP', 'VAR_GLOBAL', 'VAR_EXTERNAL', 'VAR_STAT', 'END_VAR',
    'CONSTANT', 'RETAIN', 'PERSISTENT', 'AT',
    'TYPE', 'END_TYPE', 'STRUCT', 'END_STRUCT', 'ARRAY', 'OF',
    'IF', 'THEN', 'ELSIF', 'ELSE', 'END_IF',
    'CASE', 'END_CASE', 'FOR', 'TO', 'BY', 'DO', 'END_FOR',
    'WHILE', 'END_WHILE', 'REPEAT', 'UNTIL', 'END_REPEAT',
    'EXIT', 'CONTINUE', 'RETURN',
    'AND', 'OR', 'XOR', 'NOT', 'MOD', 'TRUE', 'FALSE', 'AND_THEN', 'OR_ELSE',
    // Test-DSL
    'TEST', 'END_TEST', 'SETUP', 'END_SETUP', 'CYCLE', 'WAIT', 'ASSERT', 'RUN_UNTIL', 'TIMEOUT', 'LOG',
  ]);

  // Test-DSL-Schlüsselwörter sind im Programmcode normale Bezeichner
  const TEST_KEYWORDS = new Set(['TEST', 'END_TEST', 'SETUP', 'END_SETUP', 'CYCLE', 'WAIT', 'ASSERT', 'RUN_UNTIL', 'TIMEOUT', 'LOG']);

  const TIME_PREFIX = /^(T|TIME|LT|LTIME)$/i;
  const DATE_PREFIX = /^(D|DATE|TOD|TIME_OF_DAY|DT|DATE_AND_TIME)$/i;

  // Zeitliteral wie 1h2m3s4ms, 1.5s, 100ms -> Millisekunden
  function parseDuration(text, line, col) {
    let s = text.replace(/_/g, '').toLowerCase();
    let neg = false;
    if (s.startsWith('-')) { neg = true; s = s.slice(1); }
    const re = /(\d+(?:\.\d+)?)(d|h|ms|m|s|us|ns)/g;
    let m, total = 0, pos = 0;
    while ((m = re.exec(s)) !== null) {
      if (m.index !== pos) throw new STError(`Ungültiges Zeitliteral '${text}'`, line, col);
      const v = parseFloat(m[1]);
      const f = { d: 86400000, h: 3600000, m: 60000, s: 1000, ms: 1, us: 0.001, ns: 0.000001 }[m[2]];
      total += v * f;
      pos = re.lastIndex;
    }
    if (pos !== s.length || s.length === 0) throw new STError(`Ungültiges Zeitliteral '${text}'`, line, col);
    return neg ? -total : total;
  }

  function lex(src, opts) {
    const testMode = !!(opts && opts.testMode);
    const toks = [];
    let i = 0, line = 1, col = 1;
    const n = src.length;

    function adv(k) {
      for (let j = 0; j < k; j++) {
        if (src[i] === '\n') { line++; col = 1; } else col++;
        i++;
      }
    }
    function push(type, value, text, l, c, extra) {
      const t = { type, value, text, line: l, col: c };
      if (extra) Object.assign(t, extra);
      toks.push(t);
    }

    while (i < n) {
      const ch = src[i];
      // Whitespace
      if (ch === ' ' || ch === '\t' || ch === '\r' || ch === '\n' || ch === '\f') { adv(1); continue; }
      const l = line, c = col;
      // Kommentare (* *) (verschachtelt), /* */, //
      if (ch === '(' && src[i + 1] === '*') {
        let depth = 1; adv(2);
        while (i < n && depth > 0) {
          if (src[i] === '(' && src[i + 1] === '*') { depth++; adv(2); }
          else if (src[i] === '*' && src[i + 1] === ')') { depth--; adv(2); }
          else adv(1);
        }
        if (depth > 0) throw new STError('Kommentar (* ... *) nicht geschlossen', l, c);
        continue;
      }
      if (ch === '/' && src[i + 1] === '*') {
        adv(2);
        while (i < n && !(src[i] === '*' && src[i + 1] === '/')) adv(1);
        if (i >= n) throw new STError('Kommentar /* ... */ nicht geschlossen', l, c);
        adv(2); continue;
      }
      if (ch === '/' && src[i + 1] === '/') {
        while (i < n && src[i] !== '\n') adv(1);
        continue;
      }
      // Pragmas {attribute ...} ignorieren
      if (ch === '{') {
        while (i < n && src[i] !== '}') adv(1);
        adv(1); continue;
      }
      // Strings
      if (ch === "'" || ch === '"') {
        const q = ch; adv(1);
        let s = '';
        while (i < n && src[i] !== q) {
          if (src[i] === '$' && i + 1 < n) {
            const e = src[i + 1];
            const map = { n: '\n', N: '\n', l: '\n', L: '\n', r: '\r', R: '\r', t: '\t', T: '\t', p: '\f', P: '\f', $: '$', "'": "'", '"': '"' };
            if (map[e] !== undefined) { s += map[e]; adv(2); continue; }
            if (/[0-9a-fA-F]{2}/.test(src.substr(i + 1, 2))) { s += String.fromCharCode(parseInt(src.substr(i + 1, 2), 16)); adv(3); continue; }
          }
          if (src[i] === '\n') throw new STError('String nicht geschlossen', l, c);
          s += src[i]; adv(1);
        }
        if (i >= n) throw new STError('String nicht geschlossen', l, c);
        adv(1);
        push('string', s, src.slice(0, 0) + q + s + q, l, c, { wide: q === '"' });
        continue;
      }
      // Direkte Adressen %IX0.0 etc.
      if (ch === '%') {
        let j = i + 1;
        while (j < n && /[A-Za-z0-9_.*]/.test(src[j])) j++;
        push('address', src.slice(i, j), src.slice(i, j), l, c);
        adv(j - i); continue;
      }
      // Zahlen
      if (/[0-9]/.test(ch)) {
        let j = i;
        // Basis-Literal 16#FF, 2#1010, 8#17
        let m = /^(\d+)#([0-9A-Fa-f_]+)/.exec(src.slice(i, i + 80));
        if (m && ['2', '8', '16'].includes(m[1])) {
          const v = parseInt(m[2].replace(/_/g, ''), parseInt(m[1]));
          push('int', v, m[0], l, c);
          adv(m[0].length); continue;
        }
        m = /^\d[\d_]*(\.\d[\d_]*)?([eE][+-]?\d+)?/.exec(src.slice(i, i + 80));
        // Achtung: "1..5" ist Bereich, kein Real
        let txt = m[0];
        if (m[1] && src[i + txt.indexOf('.') + 1] === '.') txt = txt.slice(0, txt.indexOf('.'));
        const clean = txt.replace(/_/g, '');
        const isReal = /[.eE]/.test(clean);
        push(isReal ? 'real' : 'int', isReal ? parseFloat(clean) : parseInt(clean, 10), txt, l, c);
        adv(txt.length); continue;
      }
      // Bezeichner / Schlüsselwörter / typisierte Literale
      if (/[A-Za-z_]/.test(ch)) {
        let j = i;
        while (j < n && /[A-Za-z0-9_]/.test(src[j])) j++;
        const word = src.slice(i, j);
        const up = word.toUpperCase();
        // Typisierte Literale: T#1s, INT#5, BOOL#TRUE, MyEnum#Wert
        if (src[j] === '#') {
          if (TIME_PREFIX.test(word)) {
            let k = j + 1;
            while (k < n && /[0-9A-Za-z_.\-]/.test(src[k])) k++;
            const body = src.slice(j + 1, k);
            push('time', parseDuration(body, l, c), src.slice(i, k), l, c);
            adv(k - i); continue;
          }
          if (DATE_PREFIX.test(word)) {
            let k = j + 1;
            while (k < n && /[0-9A-Za-z_.\-:]/.test(src[k])) k++;
            const body = src.slice(j + 1, k);
            push('date', body, src.slice(i, k), l, c, { dateKind: up });
            adv(k - i); continue;
          }
          // Typpräfix: <TYPE>#<literal>  bzw. Enum#Wert
          push('typeprefix', up, word + '#', l, c);
          adv(j - i + 1); continue;
        }
        if (KEYWORDS.has(up) && (testMode || !TEST_KEYWORDS.has(up))) push('kw', up, word, l, c);
        else push('ident', up, word, l, c);
        adv(j - i); continue;
      }
      // Operatoren
      const two = src.substr(i, 2);
      if ([':=', '=>', '<>', '<=', '>=', '**', '..'].includes(two)) {
        push('op', two, two, l, c); adv(2); continue;
      }
      if ('+-*/()[],;:.=<>&^#'.includes(ch)) { push('op', ch, ch, l, c); adv(1); continue; }
      throw new STError(`Unerwartetes Zeichen '${ch}'`, l, c);
    }
    push('eof', null, '<Dateiende>', line, col);
    return toks;
  }

  ST.STError = STError;
  ST.lex = lex;
  ST.parseDuration = parseDuration;
})(typeof globalThis.ST !== 'undefined' ? globalThis.ST : (globalThis.ST = {}));

// ST Parser – erzeugt einen AST aus den Tokens
(function (ST) {
  'use strict';
  const { STError } = ST;

  const VAR_KINDS = ['VAR', 'VAR_INPUT', 'VAR_OUTPUT', 'VAR_IN_OUT', 'VAR_TEMP', 'VAR_GLOBAL', 'VAR_EXTERNAL', 'VAR_STAT'];

  class Parser {
    constructor(src, opts) {
      this.opts = opts || {};
      this.toks = ST.lex(src, opts);
      this.p = 0;
      this.errors = [];
    }
    get t() { return this.toks[this.p]; }
    peek(k) { return this.toks[Math.min(this.p + (k || 0), this.toks.length - 1)]; }
    next() { const t = this.toks[this.p]; if (t.type !== 'eof') this.p++; return t; }
    isKw(v) { return this.t.type === 'kw' && this.t.value === v; }
    isOp(v) { return this.t.type === 'op' && this.t.value === v; }
    err(msg, tok) { tok = tok || this.t; return new STError(msg, tok.line, tok.col); }
    expectKw(v) {
      if (!this.isKw(v)) throw this.err(`'${v}' erwartet, gefunden '${this.t.text}'`);
      return this.next();
    }
    expectOp(v) {
      if (!this.isOp(v)) {
        // Fehlendes ';' am Zeilenende: Fehler an das Ende des vorherigen Tokens hängen
        if (v === ';' && this.p > 0) {
          const prev = this.toks[this.p - 1];
          throw new STError(`';' erwartet nach '${prev.text}'`, prev.line, prev.col + String(prev.text).length);
        }
        throw this.err(`'${v}' erwartet, gefunden '${this.t.text}'`);
      }
      return this.next();
    }
    acceptOp(v) { if (this.isOp(v)) { this.next(); return true; } return false; }
    acceptKw(v) { if (this.isKw(v)) { this.next(); return true; } return false; }
    ident(what) {
      if (this.t.type !== 'ident') throw this.err(`${what || 'Bezeichner'} erwartet, gefunden '${this.t.text}'`);
      return this.next();
    }

    // ---------- Dateiebene ----------
    parseFile() {
      const file = { globals: [], types: [], pous: [] };
      while (this.t.type !== 'eof') {
        if (this.isKw('VAR_GLOBAL')) file.globals.push(this.parseVarSection());
        else if (this.isKw('TYPE')) file.types.push(...this.parseTypeBlock());
        else if (this.isKw('PROGRAM') || this.isKw('FUNCTION_BLOCK') || this.isKw('FUNCTION')) file.pous.push(this.parsePou());
        else if (this.isOp(';')) this.next();
        else throw this.err(`PROGRAM, FUNCTION_BLOCK, FUNCTION, TYPE oder VAR_GLOBAL erwartet, gefunden '${this.t.text}'`);
      }
      return file;
    }

    parseTypeBlock() {
      this.expectKw('TYPE');
      const out = [];
      do {
        const nameTok = this.ident('Typname');
        // CODESYS: TYPE X : STRUCT ... END_STRUCT END_TYPE  oder  TYPE X : (A, B) ; END_TYPE
        this.expectOp(':');
        const spec = this.parseTypeSpec(true);
        let init = null;
        if (this.acceptOp(':=')) init = this.parseExpr();
        this.acceptOp(';');
        out.push({ name: nameTok.value, display: nameTok.text, spec, init, line: nameTok.line });
      } while (this.t.type === 'ident');
      this.expectKw('END_TYPE');
      return out;
    }

    parsePou() {
      const kindTok = this.next();
      const kind = kindTok.value;
      const nameTok = this.ident(`Name für ${kind}`);
      const pou = { kind, name: nameTok.value, display: nameTok.text, line: nameTok.line, sections: [], body: [], retType: null };
      if (kind === 'FUNCTION') {
        if (this.acceptOp(':')) pou.retType = this.parseTypeSpec(false);
      }
      // CODESYS: EXTENDS / IMPLEMENTS ignorieren wir nicht stillschweigend
      if (this.t.type === 'ident' && (this.t.value === 'EXTENDS' || this.t.value === 'IMPLEMENTS'))
        throw this.err(`'${this.t.text}' (OOP) wird vom Simulator nicht unterstützt`);
      while (VAR_KINDS.includes(this.t.value) && this.t.type === 'kw') pou.sections.push(this.parseVarSection());
      const endKw = 'END_' + kind;
      pou.body = this.parseStatements([endKw]);
      this.expectKw(endKw);
      return pou;
    }

    parseVarSection() {
      const kTok = this.next();
      const sec = { kind: kTok.value, constant: false, retain: false, vars: [], line: kTok.line };
      for (;;) {
        if (this.acceptKw('CONSTANT')) sec.constant = true;
        else if (this.acceptKw('RETAIN') || this.acceptKw('PERSISTENT')) sec.retain = true;
        else break;
      }
      while (!this.isKw('END_VAR')) {
        if (this.t.type === 'eof') throw this.err("'END_VAR' fehlt");
        sec.vars.push(...this.parseVarDecl());
      }
      this.expectKw('END_VAR');
      return sec;
    }

    parseVarDecl() {
      const names = [this.ident('Variablenname')];
      while (this.acceptOp(',')) names.push(this.ident('Variablenname'));
      let address = null;
      if (this.acceptKw('AT')) {
        if (this.t.type !== 'address') throw this.err('Adresse (z.B. %IX0.0) erwartet');
        address = this.next().value;
      }
      this.expectOp(':');
      const type = this.parseTypeSpec(false);
      let init = null;
      if (this.acceptOp(':=')) init = this.parseInitializer();
      this.expectOp(';');
      return names.map(n => ({ name: n.value, display: n.text, type, init, address, line: n.line, col: n.col }));
    }

    parseInitializer() {
      if (this.isOp('[')) {
        const t = this.next();
        const items = [];
        if (!this.isOp(']')) {
          do {
            // n(wert) Wiederholung
            if (this.t.type === 'int' && this.peek(1).type === 'op' && this.peek(1).value === '(') {
              const cnt = this.next().value; this.next();
              const v = this.isOp(')') ? null : this.parseInitializer();
              this.expectOp(')');
              items.push({ repeat: cnt, value: v });
            } else items.push({ repeat: 1, value: this.parseInitializer() });
          } while (this.acceptOp(','));
        }
        this.expectOp(']');
        return { e: 'arrinit', items, line: t.line, col: t.col };
      }
      // Struct-Initialisierung (a := 1, b := 2)
      if (this.isOp('(') && this.peek(1).type === 'ident' && this.peek(2).type === 'op' && this.peek(2).value === ':=') {
        const t = this.next();
        const fields = [];
        do {
          const f = this.ident('Feldname');
          this.expectOp(':=');
          fields.push({ name: f.value, display: f.text, value: this.parseInitializer() });
        } while (this.acceptOp(','));
        this.expectOp(')');
        return { e: 'structinit', fields, line: t.line, col: t.col };
      }
      return this.parseExpr();
    }

    parseTypeSpec(inTypeBlock) {
      const t = this.t;
      if (this.isKw('ARRAY')) {
        this.next();
        this.expectOp('[');
        const dims = [];
        do {
          const lo = this.parseExpr();
          this.expectOp('..');
          const hi = this.parseExpr();
          dims.push({ lo, hi });
        } while (this.acceptOp(','));
        this.expectOp(']');
        this.expectKw('OF');
        const elem = this.parseTypeSpec(false);
        return { k: 'array', dims, elem, line: t.line };
      }
      if (this.isKw('STRUCT')) {
        this.next();
        const fields = [];
        while (!this.isKw('END_STRUCT')) {
          if (this.t.type === 'eof') throw this.err("'END_STRUCT' fehlt");
          fields.push(...this.parseVarDecl());
        }
        this.next();
        return { k: 'struct', fields, line: t.line };
      }
      if (this.isOp('(')) {
        // Aufzählungstyp
        this.next();
        const values = [];
        do {
          const n = this.ident('Enum-Wert');
          let v = null;
          if (this.acceptOp(':=')) v = this.parseExpr();
          values.push({ name: n.value, display: n.text, value: v, line: n.line });
        } while (this.acceptOp(','));
        this.expectOp(')');
        let base = null;
        if (this.t.type === 'ident') base = this.next().value; // TYPE E : (A,B) INT;
        return { k: 'enum', values, base, line: t.line };
      }
      if (this.t.type === 'ident') {
        const n = this.next();
        if (n.value === 'POINTER' || n.value === 'REFERENCE')
          throw this.err(`${n.text} TO wird vom Simulator nicht unterstützt`, n);
        if ((n.value === 'STRING' || n.value === 'WSTRING') && (this.isOp('(') || this.isOp('['))) {
          const close = this.isOp('(') ? ')' : ']';
          this.next();
          const len = this.parseExpr();
          this.expectOp(close);
          return { k: 'string', name: n.value, len, line: n.line };
        }
        // Unterbereich INT(0..100)
        if (this.isOp('(') && !inTypeBlock) {
          this.next();
          const lo = this.parseExpr(); this.expectOp('..'); const hi = this.parseExpr();
          this.expectOp(')');
          return { k: 'named', name: n.value, display: n.text, range: { lo, hi }, line: n.line, col: n.col };
        }
        if (this.isOp('(') && inTypeBlock) {
          this.next();
          const lo = this.parseExpr(); this.expectOp('..'); const hi = this.parseExpr();
          this.expectOp(')');
          return { k: 'named', name: n.value, display: n.text, range: { lo, hi }, line: n.line, col: n.col };
        }
        return { k: 'named', name: n.value, display: n.text, line: n.line, col: n.col };
      }
      throw this.err(`Datentyp erwartet, gefunden '${this.t.text}'`);
    }

    // ---------- Anweisungen ----------
    parseStatements(terminators) {
      const list = [];
      for (;;) {
        const t = this.t;
        if (t.type === 'eof') {
          throw this.err(`'${terminators[0]}' fehlt (Dateiende erreicht)`);
        }
        if (t.type === 'kw' && terminators.includes(t.value)) break;
        // CASE-Label-Erkennung: Zahl/Ident gefolgt von ':' oder ',' oder '..' beendet Block innerhalb CASE
        if (terminators.includes('#CASELABEL') && this.looksLikeCaseLabel()) break;
        if (this.acceptOp(';')) continue;
        const start = this.p;
        try { list.push(this.parseStatement()); }
        catch (e) {
          if (!(e instanceof STError) || this.errors.length > 50) throw e;
          this.errors.push(e);
          // Synchronisieren: bis hinter das nächste ';' oder zum Blockende springen
          if (this.p === start) this.next();
          while (this.t.type !== 'eof' && !this.isOp(';') && !(this.t.type === 'kw' && /^END_|^(ELSE|ELSIF|UNTIL)$/.test(this.t.value))) this.next();
          this.acceptOp(';');
        }
      }
      return list;
    }

    looksLikeCaseLabel() {
      // Label: [-] literal | ident | typeprefix ident  gefolgt von ':' ',' '..'
      let k = 0;
      let t = this.peek(k);
      if (t.type === 'op' && t.value === '-') { k++; t = this.peek(k); }
      if (t.type === 'typeprefix') { k++; t = this.peek(k); }
      if (!['int', 'ident', 'string'].includes(t.type)) return false;
      // Ident-Pfad mit Punkt (Enum.Wert)
      k++;
      while (this.peek(k).type === 'op' && this.peek(k).value === '.' && this.peek(k + 1).type === 'ident') k += 2;
      const nt = this.peek(k);
      if (nt.type !== 'op') return false;
      if (nt.value === ':' || nt.value === '..') return true;
      if (nt.value === ',') return true; // in Anweisungen ist ',' am Anfang nie gültig
      return false;
    }

    parseStatement() {
      const t = this.t;
      if (t.type === 'kw') {
        switch (t.value) {
          case 'IF': return this.parseIf();
          case 'CASE': return this.parseCase();
          case 'FOR': return this.parseFor();
          case 'WHILE': {
            this.next();
            const cond = this.parseExpr();
            this.expectKw('DO');
            const body = this.parseStatements(['END_WHILE']);
            this.expectKw('END_WHILE'); this.acceptOp(';');
            return { s: 'while', cond, body, line: t.line, col: t.col };
          }
          case 'REPEAT': {
            this.next();
            const body = this.parseStatements(['UNTIL']);
            this.expectKw('UNTIL');
            const cond = this.parseExpr();
            this.expectKw('END_REPEAT'); this.acceptOp(';');
            return { s: 'repeat', cond, body, line: t.line, col: t.col };
          }
          case 'EXIT': this.next(); this.expectOp(';'); return { s: 'exit', line: t.line, col: t.col };
          case 'CONTINUE': this.next(); this.expectOp(';'); return { s: 'continue', line: t.line, col: t.col };
          case 'RETURN': this.next(); this.expectOp(';'); return { s: 'return', line: t.line, col: t.col };
          // Test-DSL
          case 'CYCLE': {
            this.next();
            let n = null;
            if (!this.isOp(';')) n = this.parseExpr();
            this.expectOp(';');
            return { s: 'cycle', n, line: t.line, col: t.col };
          }
          case 'WAIT': {
            this.next();
            const dur = this.parseExpr();
            this.expectOp(';');
            return { s: 'wait', dur, line: t.line, col: t.col };
          }
          case 'ASSERT': {
            this.next();
            const i0 = this.p;
            const cond = this.parseExpr();
            const src = this.srcText(i0, this.p);
            let msg = null;
            if (this.acceptOp(',')) msg = this.parseExpr();
            this.expectOp(';');
            return { s: 'assert', cond, msg, line: t.line, col: t.col, src };
          }
          case 'RUN_UNTIL': {
            this.next();
            const cond = this.parseExpr();
            let timeout = null;
            if (this.acceptKw('TIMEOUT')) timeout = this.parseExpr();
            this.expectOp(';');
            return { s: 'rununtil', cond, timeout, line: t.line, col: t.col };
          }
          case 'LOG': {
            this.next();
            const args = [this.parseExpr()];
            while (this.acceptOp(',')) args.push(this.parseExpr());
            this.expectOp(';');
            return { s: 'log', args, line: t.line, col: t.col };
          }
        }
      }
      // Zuweisung oder Aufruf
      const lhs = this.parsePostfix();
      if (this.isOp(':=')) {
        this.next();
        const value = this.parseExpr();
        this.expectOp(';');
        return { s: 'assign', target: lhs, value, line: t.line, col: t.col };
      }
      if (lhs.e === 'call') {
        this.expectOp(';');
        return { s: 'call', call: lhs, line: t.line, col: t.col };
      }
      if (this.isOp('=')) throw this.err("'=' ist ein Vergleich – für Zuweisungen ':=' verwenden");
      if (lhs.e === 'id' || lhs.e === 'member') {
        // FB-Instanz ohne Klammern aufgerufen? -> Fehlende ':=' oder ';'
        throw this.err(`':=' oder '(' erwartet nach '${this.toks[this.p - 1].text}', gefunden '${this.t.text}'`);
      }
      throw this.err(`Anweisung erwartet, gefunden '${t.text}'`, t);
    }

    srcText(i0, i1) {
      // Rekonstruiert den Quelltext eines Ausdrucks aus den Tokens (für Meldungen)
      let out = '';
      for (let i = i0; i < i1; i++) {
        const tk = this.toks[i], prev = this.toks[i - 1];
        const glue = i === i0 || (tk.type === 'op' && ['.', ')', ']', ','].includes(tk.value)) ||
          (prev.type === 'op' && ['.', '(', '['].includes(prev.value)) ||
          (tk.type === 'op' && tk.value === '(' && prev.type === 'ident') ||
          (prev.type === 'op' && prev.value === '-' && (i - 2 < i0 || this.toks[i - 2].type === 'op' || this.toks[i - 2].type === 'kw'));
        out += (glue ? '' : ' ') + (tk.type === 'string' ? "'" + tk.value + "'" : tk.text);
      }
      return out;
    }

    parseIf() {
      const t = this.next();
      const branches = [];
      const cond = this.parseExpr();
      this.expectKw('THEN');
      const body = this.parseStatements(['ELSIF', 'ELSE', 'END_IF']);
      branches.push({ cond, body });
      let elseBody = null;
      for (;;) {
        if (this.acceptKw('ELSIF')) {
          const c = this.parseExpr();
          this.expectKw('THEN');
          branches.push({ cond: c, body: this.parseStatements(['ELSIF', 'ELSE', 'END_IF']) });
        } else if (this.acceptKw('ELSE')) {
          elseBody = this.parseStatements(['END_IF']);
        } else break;
      }
      this.expectKw('END_IF');
      this.acceptOp(';');
      return { s: 'if', branches, elseBody, line: t.line, col: t.col };
    }

    parseCase() {
      const t = this.next();
      const expr = this.parseExpr();
      this.expectKw('OF');
      const cases = [];
      let elseBody = null;
      for (;;) {
        if (this.isKw('END_CASE')) break;
        if (this.acceptKw('ELSE')) { this.acceptOp(':'); elseBody = this.parseStatements(['END_CASE']); break; }
        if (this.acceptOp(';')) continue;
        const labels = [];
        const lt = this.t;
        do {
          const lo = this.parseCaseValue();
          if (this.acceptOp('..')) labels.push({ lo, hi: this.parseCaseValue() });
          else labels.push({ lo, hi: null });
        } while (this.acceptOp(','));
        if (!this.isOp(':')) throw this.err(`':' nach CASE-Marke erwartet, gefunden '${this.t.text}'`);
        this.next();
        const body = this.parseStatements(['END_CASE', 'ELSE', '#CASELABEL']);
        cases.push({ labels, body, line: lt.line });
      }
      this.expectKw('END_CASE');
      this.acceptOp(';');
      return { s: 'case', expr, cases, elseBody, line: t.line, col: t.col };
    }

    parseCaseValue() {
      // Ausdruck ohne Vergleichsoperatoren (':' darf nicht verschluckt werden)
      return this.parseAdd();
    }

    parseFor() {
      const t = this.next();
      const v = this.ident('Laufvariable');
      this.expectOp(':=');
      const from = this.parseExpr();
      this.expectKw('TO');
      const to = this.parseExpr();
      let by = null;
      if (this.acceptKw('BY')) by = this.parseExpr();
      this.expectKw('DO');
      const body = this.parseStatements(['END_FOR']);
      this.expectKw('END_FOR');
      this.acceptOp(';');
      return { s: 'for', v: { e: 'id', name: v.value, display: v.text, line: v.line, col: v.col }, from, to, by, body, line: t.line, col: t.col };
    }

    // ---------- Ausdrücke ----------
    // Priorität (niedrig → hoch): OR/OR_ELSE, XOR, AND/&/AND_THEN, = <>, < > <= >=, + -, * / MOD, **, unär, postfix
    parseExpr() { return this.parseOr(); }
    bin(op, a, b, t) { return { e: 'bin', op, a, b, line: t.line, col: t.col }; }
    parseOr() {
      let a = this.parseXor();
      while (this.isKw('OR') || this.isKw('OR_ELSE')) { const t = this.next(); a = this.bin(t.value, a, this.parseXor(), t); }
      return a;
    }
    parseXor() {
      let a = this.parseAnd();
      while (this.isKw('XOR')) { const t = this.next(); a = this.bin('XOR', a, this.parseAnd(), t); }
      return a;
    }
    parseAnd() {
      let a = this.parseEq();
      while (this.isKw('AND') || this.isOp('&') || this.isKw('AND_THEN')) {
        const t = this.next(); a = this.bin(t.value === '&' ? 'AND' : t.value, a, this.parseEq(), t);
      }
      return a;
    }
    parseEq() {
      let a = this.parseRel();
      while (this.isOp('=') || this.isOp('<>')) { const t = this.next(); a = this.bin(t.value, a, this.parseRel(), t); }
      return a;
    }
    parseRel() {
      let a = this.parseAdd();
      while (this.isOp('<') || this.isOp('>') || this.isOp('<=') || this.isOp('>=')) { const t = this.next(); a = this.bin(t.value, a, this.parseAdd(), t); }
      return a;
    }
    parseAdd() {
      let a = this.parseMul();
      while (this.isOp('+') || this.isOp('-')) { const t = this.next(); a = this.bin(t.value, a, this.parseMul(), t); }
      return a;
    }
    parseMul() {
      let a = this.parsePow();
      while (this.isOp('*') || this.isOp('/') || this.isKw('MOD')) { const t = this.next(); a = this.bin(t.value, a, this.parsePow(), t); }
      return a;
    }
    parsePow() {
      let a = this.parseUnary();
      while (this.isOp('**')) { const t = this.next(); a = this.bin('**', a, this.parseUnary(), t); }
      return a;
    }
    parseUnary() {
      const t = this.t;
      if (this.isOp('-')) {
        this.next();
        const x = this.parseUnary();
        if (x.e === 'lit' && typeof x.v === 'number') return Object.assign({}, x, { v: -x.v, line: t.line, col: t.col });
        return { e: 'un', op: '-', x, line: t.line, col: t.col };
      }
      if (this.isOp('+')) { this.next(); return this.parseUnary(); }
      if (this.isKw('NOT')) { this.next(); return { e: 'un', op: 'NOT', x: this.parseUnary(), line: t.line, col: t.col }; }
      return this.parsePostfix();
    }

    parsePostfix() {
      let x = this.parsePrimary();
      for (;;) {
        const t = this.t;
        if (this.isOp('.')) {
          this.next();
          if (this.t.type === 'int') { const b = this.next(); x = { e: 'bit', obj: x, bit: b.value, line: t.line, col: t.col }; continue; }
          const n = this.t.type === 'ident' || this.t.type === 'kw' ? this.next() : null;
          if (!n) throw this.err(`Name nach '.' erwartet, gefunden '${this.t.text}'`);
          x = { e: 'member', obj: x, name: n.value, display: n.text, line: n.line, col: n.col };
        } else if (this.isOp('[')) {
          this.next();
          const idx = [this.parseExpr()];
          while (this.acceptOp(',')) idx.push(this.parseExpr());
          this.expectOp(']');
          x = { e: 'index', obj: x, idx, line: t.line, col: t.col };
        } else if (this.isOp('(') && (x.e === 'id' || x.e === 'member' || x.e === 'index')) {
          this.next();
          const args = [];
          if (!this.isOp(')')) {
            do {
              if (this.t.type === 'ident' && this.peek(1).type === 'op' && (this.peek(1).value === ':=' || this.peek(1).value === '=>')) {
                const n = this.next(); const op = this.next().value;
                if (op === '=>') {
                  const target = this.parsePostfix();
                  args.push({ name: n.value, display: n.text, value: target, out: true, line: n.line, col: n.col });
                } else {
                  args.push({ name: n.value, display: n.text, value: this.parseExpr(), out: false, line: n.line, col: n.col });
                }
              } else if (this.isKw('NOT') && this.peek(1).type === 'ident' && this.peek(2).type === 'op' && this.peek(2).value === '=>') {
                throw this.err('NOT bei Ausgangszuweisung (=>) wird nicht unterstützt');
              } else {
                args.push({ name: null, value: this.parseExpr(), line: this.t.line, col: this.t.col });
              }
            } while (this.acceptOp(','));
          }
          this.expectOp(')');
          x = { e: 'call', fn: x, args, line: x.line, col: x.col };
        } else if (this.isOp('^')) {
          throw this.err('Pointer-Dereferenzierung (^) wird nicht unterstützt');
        } else break;
      }
      return x;
    }

    parsePrimary() {
      const t = this.t;
      switch (t.type) {
        case 'int': this.next(); return { e: 'lit', v: t.value, t: 'ANY_INT', line: t.line, col: t.col };
        case 'real': this.next(); return { e: 'lit', v: t.value, t: 'ANY_REAL', line: t.line, col: t.col };

        if (p.kind === 'FUNCTION') return { where: 'func', pou: p };
        return { where: 'fbtype', pou: p };
      }

      if (this.types.has(name)) return { where: 'type', type: this.resolveNamedType(name, this.types.get(name).decl) };

      }

    }

      const out = [...this.globals.keys(), ...this.pous.keys(), ...this.enumValues.keys()];
      if (scope.pou) out.push(...scope.pou.vars.keys());
      if (scope.locals) out.push(...scope.locals.keys());

    }
