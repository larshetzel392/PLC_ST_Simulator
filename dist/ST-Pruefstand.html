      if (!lk) {
        if (fnE.name === 'TIME' && e.args.length === 0) return { t: E.TIME, f: c => c.rt.now };
        const bf = T.getFunc(fnE.name);
        if (bf) return this.callBuiltin(e, bf, scope);
        const cands = [...this.pous.values()].filter(p => p.kind !== 'FUNCTION_BLOCK' || true).map(p => p.name).concat(Object.keys(T.FUNCS));
        const s = this.suggest(fnE.name, cands);
        this.error(`Unbekannte Funktion/Baustein '${fnE.display}'${s ? ` – meinten Sie '${s}'?` : ''}`, fnE);
        return null;
      }
      if (lk.where === 'func') return this.callFunction(e, lk.pou, scope);
      if (lk.where === 'prog') {
        if (scope.pou) {
          if (lk.pou === scope.pou) { this.error(`Programm '${lk.pou.display}' ruft sich selbst auf`, e); return null; }
          scope.pou.calls.add(lk.pou.name);
        }
        const K = lk.pou.name;
        return this.callInstance(e, lk.pou, c => c.P[K], scope, true);
      }
      if (lk.where === 'fbtype') { this.error(`'${lk.pou.display}' ist ein FB-Typ – bitte eine Instanz deklarieren (z.B. fb${lk.pou.display} : ${lk.pou.display};) und diese aufrufen`, e); return null; }
    }
    const ref = this.compileRef(fnE, scope);
    if (!ref) return null;
    if (ref.t.k === 'fb') {
      if (scope.pou && ref.t.pou === scope.pou) { this.error('Rekursiver FB-Aufruf', e); return null; }
      return this.callInstance(e, ref.t.pou, ref.get, scope, false);
    }
    this.error(`'${fnE.display || '?'}' ist vom Typ ${T.typeName(ref.t)} und kann nicht aufgerufen werden`, e);
    return null;
  };

  // FB- oder Programmaufruf
  P.callInstance = function (e, pou, getInst, scope, isProg) {
    const ins = [], outs = [], inouts = [];
    const seen = new Set();
    for (const a of e.args) {
      if (!a.name) {
        this.error(`Beim Aufruf von '${pou.display}' müssen Parameter benannt werden (Name := Wert)`, a.value);
        continue;
      }
      if (seen.has(a.name)) { this.error(`Parameter '${a.display}' mehrfach angegeben`, a); continue; }
      seen.add(a.name);
      const f = pou.vars.get(a.name);
      if (!f || f.hidden) {
        const s = this.suggest(a.name, [...pou.vars.values()].filter(v => !v.hidden && ['VAR_INPUT', 'VAR_OUTPUT', 'VAR_IN_OUT'].includes(v.section)).map(v => v.name));
        this.error(`'${pou.display}' hat keinen Parameter '${a.display}'${s ? ` – meinten Sie '${pou.vars.get(s).display}'?` : ''}`, a);
        continue;
      }
      this.markUsed(f);
      if (a.out) {
        if (f.section !== 'VAR_OUTPUT') { this.error(`'${a.display}' ist kein Ausgang von '${pou.display}' ('=>' nur für VAR_OUTPUT)`, a); continue; }
        const tgt = this.compileRef(a.value, scope);
        if (!tgt) { if (!['id', 'member', 'index', 'bit'].includes(a.value.e)) this.error("Ziel von '=>' muss eine Variable sein", a.value); continue; }
        this.checkAssignTarget(tgt, a.value);
        this.checkAssign(tgt.t, f.type, a.value, `Ausgang '${a.display}'`);
        this.markWrite(tgt, scope);
        outs.push({ K: a.name, set: tgt.set });
      } else {
        if (f.section === 'VAR_OUTPUT') { this.error(`'${a.display}' ist ein Ausgang – mit '=>' abholen statt ':='`, a); continue; }
        if (f.section === 'VAR_IN_OUT') {
          const tgt = this.compileRef(a.value, scope);
          if (!tgt || !tgt.set) { this.error(`VAR_IN_OUT '${a.display}' braucht eine Variable`, a.value); continue; }
          this.checkAssign(f.type, tgt.t, a.value, `Parameter '${a.display}'`);
          inouts.push({ K: a.name, get: tgt.get, set: tgt.set, co: coercer(f.type) });
          continue;
        }
        if (f.section !== 'VAR_INPUT') {
          if (!isProg || scope.kind === 'pou') { this.error(`'${a.display}' ist kein Eingang von '${pou.display}'`, a); continue; }
        }
        const v = this.compileExpr(a.value, scope);
        if (!v) continue;
        this.checkAssign(f.type, v.t, a.value, `Eingang '${a.display}'`);
        if (scope.kind === 'pou' && scope.pou && scope.pou.role !== 'model') f.plcWrites = true;
        ins.push({ K: a.name, f: v.f, co: coercer(f.type) });
      }
    }
    for (const f of pou.vars.values())
      if (f.section === 'VAR_IN_OUT' && !seen.has(f.name)) this.error(`VAR_IN_OUT '${f.display}' von '${pou.display}' muss beim Aufruf angegeben werden`, e);
    const temps = pou.builtin ? [] : [...pou.vars.values()].filter(v => v.section === 'VAR_TEMP');
    const run = this.instanceRunner(pou, temps);
    const nIn = ins.length, nOut = outs.length, nIo = inouts.length;
    return {
      t: T.VOID,
      f: c => {
        const inst = getInst(c);
        const fz = inst.__f;
        for (let i = 0; i < nIn; i++) { const p = ins[i]; const v = p.co(p.f(c)); if (!(fz && fz[p.K])) inst[p.K] = v; }
        for (let i = 0; i < nIo; i++) { const p = inouts[i]; const v = p.co(p.get(c)); if (!(fz && fz[p.K])) inst[p.K] = v; }
        run(inst, c);
        for (let i = 0; i < nIo; i++) { const p = inouts[i]; p.set(c, inst[p.K]); }
        for (let i = 0; i < nOut; i++) { const p = outs[i]; p.set(c, inst[p.K]); }
      },
    };
  };

  P.instanceRunner = function (pou, temps) {
    if (pou.native) { const nat = pou.native; return (inst, c) => nat(inst, c.rt); }
    return (inst, c) => {
      for (const v of temps) inst[v.name] = v.init !== undefined ? T.deepCopy(v.init) : T.defaultValue(v.type);
      const rt = c.rt;
      if (++rt.depth > 64) rtErr(`Aufruftiefe überschritten (Rekursion?) in '${pou.display}'`);
      const saved = rt.loc;
      pou.body({ self: inst, G: c.G, P: c.P, rt });
      rt.loc = saved;
      rt.depth--;
    };
  };

  P.callFunction = function (e, pou, scope) {
    if (scope.pou === pou) { this.error(`Rekursiver Aufruf von '${pou.display}' ist nicht erlaubt`, e); return null; }
    const params = pou.inputs.map(n => pou.vars.get(n));
    const ins = [], outs = [];
    const given = new Set();
    let pos = 0;
    for (const a of e.args) {
      let f;
      if (a.name) {
        f = pou.vars.get(a.name);
        if (!f || !['VAR_INPUT', 'VAR_OUTPUT', 'VAR_IN_OUT'].includes(f.section)) { this.error(`'${pou.display}' hat keinen Parameter '${a.display}'`, a); continue; }
      } else {
        f = params[pos++];
        if (!f) { this.error(`Zu viele Argumente für '${pou.display}' (erwartet ${params.length})`, a.value); continue; }
      }
      given.add(f.name);
      if (a.out) {
        if (f.section !== 'VAR_OUTPUT') { this.error(`'${a.display}' ist kein Ausgang`, a); continue; }
        const tgt = this.compileRef(a.value, scope);
        if (!tgt) continue;
        this.checkAssignTarget(tgt, a.value);
        outs.push({ K: f.name, set: tgt.set });
        continue;
      }
      if (f.section === 'VAR_IN_OUT') {
        const tgt = this.compileRef(a.value, scope);
        if (!tgt || !tgt.set) { this.error(`VAR_IN_OUT '${f.display}' braucht eine Variable`, a.value); continue; }
        ins.push({ K: f.name, f: tgt.get, co: coercer(f.type) });
        outs.push({ K: f.name, set: tgt.set });
        continue;
      }
      const v = this.compileExpr(a.value, scope);
      if (!v) continue;
      this.checkAssign(f.type, v.t, a.value, `Parameter '${f.display}'`);
      ins.push({ K: f.name, f: v.f, co: coercer(f.type) });
    }
    for (const p of params) if (!given.has(p.name) && p.init === undefined && p.section === 'VAR_INPUT' && e.args.every(a => !a.name))
      this.error(`Argument '${p.display}' fehlt beim Aufruf von '${pou.display}'`, e);
    const make = pou.type.makeInstance, RK = pou.name;
    const run = this.instanceRunner(pou, []);
    const hasRet = pou.retType !== T.VOID;
    return {
      t: pou.retType,
      f: c => {
        const fr = make();
        for (let i = 0; i < ins.length; i++) { const p = ins[i]; fr[p.K] = p.co(p.f(c)); }
        run(fr, c);
        for (let i = 0; i < outs.length; i++) outs[i].set(c, fr[outs[i].K]);
        return hasRet ? fr[RK] : undefined;
      },
    };
  };

  P.callBuiltin = function (e, bf, scope) {
    const args = [];
    for (const a of e.args) {
      if (a.out) { this.error(`'=>' bei Standardfunktion '${bf.name}' nicht möglich`, a); return null; }
      const v = this.compileExpr(a.value, scope);
      if (!v) return null;
      args.push(v);
    }
    if (args.length < bf.minArgs || args.length > bf.maxArgs) {
      this.error(`'${bf.name}' erwartet ${bf.minArgs === bf.maxArgs ? bf.minArgs : bf.minArgs + '..' + (bf.maxArgs > 50 ? 'n' : bf.maxArgs)} Argument(e), ${args.length} angegeben`, e);
      return null;
    }
    let rt;
    const at = args.map(a => a.t);
    try { rt = bf.sig(at, e); }
    catch (err) { if (typeof err === 'string') { this.error(`${bf.name}: ${err}`, e); return null; } throw err; }
    const fs = args.map(a => a.f), impl = bf.impl, n = fs.length;
    const co = rt.k === 'elem' && !rt.lit ? coercer(rt) : (v => v);
    const f = c => {
      const vals = new Array(n);
      for (let i = 0; i < n; i++) vals[i] = fs[i](c);
      let r;
      try { r = impl(vals, rt, at); }
      catch (err) { if (err instanceof Error && !(err instanceof STRuntimeError)) rtErr(err.message); throw err; }
      return co(r);
    };
    if (args.every(a => a.constVal !== undefined)) {
      try { const v = f(null); return { t: rt, f: () => v, constVal: v }; } catch (err) { /* zur Laufzeit */ }
    }
    return { t: rt, f };
  };

  // Merkt, welche Variablen das SPS-Programm selbst schreibt (Ausgänge/Merker vs. Eingänge)
  P.markWrite = function (ref, scope) {
    if (ref && ref.info && scope.kind === 'pou' && scope.pou && scope.pou.role !== 'model') ref.info.plcWrites = true;
  };

  // ---------- Typprüfungen ----------
  P.checkAssign = function (dst, src, node, what) {
    const r = T.assignCheck(dst, src);
    if (!r) return true;
    if (r.error) { this.error(what ? `${what}: ${r.error}` : r.error, node); return false; }
    if (r.warn) this.warn(what ? `${what}: ${r.warn}` : r.warn, node);
    return true;
  };
  P.checkAssignTarget = function (ref, node) {
    if (ref.special) { this.error('Ziel der Zuweisung ist keine Variable', node); return false; }
    if (!ref.set) { this.error('Ziel kann nicht beschrieben werden', node); return false; }
    if (ref.readonly) { this.error(ref.readonly, node); return false; }
    return true;
  };

  // ---------- Anweisungen ----------
  P.compileBlock = function (stmts, scope) {
    const fs = [];
    for (const s of stmts) {
      const f = this.compileStmt(s, scope);
      if (f) fs.push(f);
    }
    const n = fs.length;
    if (n === 0) return () => 0;
    if (n === 1) return fs[0];
    return c => {
      for (let i = 0; i < n; i++) { const r = fs[i](c); if (r) return r; }
      return 0;
    };
  };

  P.compileStmt = function (s, scope) {
    const loc = { line: s.line, col: s.col, file: scope.file };
    const inner = this.compileStmtInner(s, scope, loc);
    if (!inner) return null;
    return c => { c.rt.loc = loc; return inner(c); };
  };

  P.compileStmtInner = function (s, scope, loc) {
    switch (s.s) {
      case 'assign': {
        const tgt = this.compileRef(s.target, scope);
        const val = this.compileExpr(s.value, scope);
        if (!tgt) { if (!['id', 'member', 'index', 'bit'].includes(s.target.e)) this.error('Linke Seite der Zuweisung muss eine Variable sein', s.target); return null; }
        if (!this.checkAssignTarget(tgt, s.target) || !val) return null;
        if (scope.loopVars && s.target.e === 'id' && scope.loopVars.includes(s.target.name))
          this.warn(`Laufvariable '${s.target.display}' wird in der Schleife verändert`, s);
        if (!this.checkAssign(tgt.t, val.t, s.value)) return null;
        this.markWrite(tgt, scope);
        const set = tgt.set, f = val.f;
        return c => { set(c, f(c)); return 0; };
      }
      case 'call': {
        const call = this.compileCall(s.call, scope);
        if (!call) return null;
        const f = call.f;
        return c => { f(c); return 0; };
      }
      case 'if': {
        const conds = [], bodies = [];
        for (const br of s.branches) {
          const cnd = this.compileExpr(br.cond, scope);
          if (cnd && !T.isBool(cnd.t)) this.error(`Bedingung muss BOOL sein, nicht ${T.typeName(cnd.t)}`, br.cond);
          conds.push(cnd ? cnd.f : () => false);
          bodies.push(this.compileBlock(br.body, scope));
        }
        const elseB = s.elseBody ? this.compileBlock(s.elseBody, scope) : null;
        const n = conds.length;
        if (n === 1) {
          const c0 = conds[0], b0 = bodies[0];
          return elseB ? (c => (c0(c) ? b0(c) : elseB(c))) : (c => (c0(c) ? b0(c) : 0));
        }
        return c => {
          for (let i = 0; i < n; i++) if (conds[i](c)) return bodies[i](c);
          return elseB ? elseB(c) : 0;
        };
      }
      case 'case': {
        const sel = this.compileExpr(s.expr, scope);
        if (sel && !T.isInt(sel.t)) this.error(`CASE-Ausdruck muss Ganzzahl oder Aufzählung sein, nicht ${T.typeName(sel.t)}`, s.expr);
        const map = new Map(), ranges = [], bodies = [];
        s.cases.forEach((cs, idx) => {
          bodies.push(this.compileBlock(cs.body, scope));
          for (const lb of cs.labels) {
            const lo = this.caseConst(lb.lo, scope, sel);
            if (lo === null) continue;
            if (lb.hi) {
              const hi = this.caseConst(lb.hi, scope, sel);
              if (hi === null) continue;
              if (hi < lo) this.error(`Leerer Bereich ${lo}..${hi}`, lb.lo);
              for (const r of ranges) if (lo <= r.hi && hi >= r.lo) this.warn(`CASE-Bereich ${lo}..${hi} überschneidet sich mit ${r.lo}..${r.hi}`, lb.lo);
              ranges.push({ lo, hi, idx });
            } else {
              if (map.has(lo) || ranges.some(r => lo >= r.lo && lo <= r.hi)) this.warn(`CASE-Marke ${lo} ist doppelt`, lb.lo);
              else map.set(lo, idx);
            }
          }
        });
        const elseB = s.elseBody ? this.compileBlock(s.elseBody, scope) : null;
        const fsel = sel ? sel.f : () => 0;
        return c => {
          const v = fsel(c);
          let i = map.get(v);
          if (i === undefined) for (const r of ranges) if (v >= r.lo && v <= r.hi) { i = r.idx; break; }
          if (i !== undefined) return bodies[i](c);
          return elseB ? elseB(c) : 0;
        };
      }
      case 'for': {
        const v = this.compileRef(s.v, scope);
        if (v && !(v.t.k === 'elem' && v.t.cat === 'int')) this.error(`Laufvariable '${s.v.display}' muss eine Ganzzahl sein`, s.v);
        const from = this.compileExpr(s.from, scope), to = this.compileExpr(s.to, scope);
        const by = s.by ? this.compileExpr(s.by, scope) : { t: E.ANY_INT, f: () => 1, constVal: 1 };
        for (const [x, n] of [[from, s.from], [to, s.to], [by, s.by]]) if (x && !T.isInt(x.t)) this.error('FOR-Grenzen müssen Ganzzahlen sein', n);
        if (by && by.constVal === 0) this.error('FOR-Schrittweite 0 ergibt eine Endlosschleife', s.by);
        const sub = Object.assign({}, scope, { loopVars: (scope.loopVars || []).concat([s.v.name]), inLoop: true });
        const body = this.compileBlock(s.body, sub);
        if (!v || !from || !to || !by) return null;
        const set = v.set, get = v.get, ff = from.f, ft = to.f, fb = by.f;
        return c => {
          const end = ft(c), step = fb(c);
          if (step === 0) rtErr('FOR-Schrittweite ist 0');
          set(c, ff(c));
          const rt = c.rt;
          for (;;) {
            const i = get(c);
            if (step > 0 ? i > end : i < end) break;
            const r = body(c);
            if (r === SIG_EXIT) break;
            if (r === SIG_RETURN) return r;
            if (++rt.loops > rt.maxLoops) rtErr('Schleifenlimit überschritten – Endlosschleife?');
            const nx = get(c) + step;
            set(c, nx);
            if (get(c) !== nx) break; // Überlauf der Laufvariable
          }
          return 0;
        };
      }
      case 'while': case 'repeat': {
        const cnd = this.compileExpr(s.cond, scope);
        if (cnd && !T.isBool(cnd.t)) this.error(`Bedingung muss BOOL sein, nicht ${T.typeName(cnd.t)}`, s.cond);
        const body = this.compileBlock(s.body, Object.assign({}, scope, { inLoop: true }));
        if (!cnd) return null;
        const fc = cnd.f;
        if (s.s === 'while') {
          return c => {
            const rt = c.rt;
            while (fc(c)) {
              const r = body(c);
              if (r === SIG_EXIT) break;
              if (r === SIG_RETURN) return r;
              if (++rt.loops > rt.maxLoops) rtErr('Schleifenlimit überschritten – Endlosschleife?');
            }
            return 0;
          };
        }
        return c => {
          const rt = c.rt;
          do {
            const r = body(c);
            if (r === SIG_EXIT) break;
            if (r === SIG_RETURN) return r;
            if (++rt.loops > rt.maxLoops) rtErr('Schleifenlimit überschritten – Endlosschleife?');
          } while (!fc(c));
          return 0;
        };
      }
      case 'exit':
        if (!scope.inLoop) this.error('EXIT außerhalb einer Schleife', s);
        return () => SIG_EXIT;
      case 'continue':
        if (!scope.inLoop) this.error('CONTINUE außerhalb einer Schleife', s);
        return () => SIG_CONTINUE;
      case 'return': return () => SIG_RETURN;
      case 'cycle': case 'wait': case 'assert': case 'rununtil': case 'log':
        if (scope.kind !== 'test') { this.error(`'${s.s.toUpperCase()}' ist nur in Testdateien erlaubt`, s); return null; }
        return this.compileTestStmt(s, scope, loc);
    }
    this.error('Unbekannte Anweisung', s);
    return null;
  };

  P.caseConst = function (e, scope, sel) {
    // Enum-Werte und Konstanten erlauben
    if (e.e === 'id' && sel && sel.t.k === 'enum' && sel.t.values.has(e.name)) return sel.t.values.get(e.name);
    const x = this.compileExpr(e, scope);
    if (!x) return null;
    if (x.constVal === undefined) { this.error('CASE-Marke muss konstant sein', e); return null; }
    if (!T.isInt(x.t)) { this.error(`CASE-Marke muss Ganzzahl sein, nicht ${T.typeName(x.t)}`, e); return null; }
    if (sel && sel.t.k === 'enum' && x.t.k === 'enum' && x.t.name !== sel.t.name) this.error(`CASE-Marke vom Typ ${x.t.display} passt nicht zu ${sel.t.display}`, e);
    return x.constVal;
  };

  // ---------- Test-Anweisungen ----------
  P.compileTestStmt = function (s, scope, loc) {
    switch (s.s) {
      case 'cycle': {
        const n = s.n ? this.compileExpr(s.n, scope) : { t: E.ANY_INT, f: () => 1 };
        if (!n) return null;
        if (!T.isInt(n.t)) { this.error('CYCLE erwartet eine Anzahl (Ganzzahl)', s.n); return null; }
        const fn = n.f;
        return c => { c.rt.test.cycles(fn(c)); return 0; };
      }
      case 'wait': {
        const d = this.compileExpr(s.dur, scope);
        if (!d) return null;
        if (!T.isTime(d.t)) { this.error('WAIT erwartet eine Zeit, z.B. WAIT T#500ms;', s.dur); return null; }
        const fd = d.f;
        return c => { c.rt.test.wait(fd(c)); return 0; };
      }
      case 'assert': {
        const cnd = this.compileExpr(s.cond, scope);
        if (!cnd) return null;
        if (!T.isBool(cnd.t)) { this.error(`ASSERT erwartet einen BOOL-Ausdruck, nicht ${T.typeName(cnd.t)}`, s.cond); return null; }
        let detail = null;
        const ce = s.cond;
        if (ce.e === 'bin' && ['=', '<>', '<', '>', '<=', '>='].includes(ce.op)) {
          const a = this.compileExpr(ce.a, scope), b = this.compileExpr(ce.b, scope);
          if (a && b) detail = c => {
            const av = fmtValue(a.t, a.f(c)), bv = fmtValue(b.t, b.f(c));
            if (a.constVal !== undefined) return `ist ${bv}`;
            if (b.constVal !== undefined) return `ist ${av}`;
            return `links ${av}, rechts ${bv}`;
          };
        }
        const msg = s.msg ? this.compileExpr(s.msg, scope) : null;
        const fc = cnd.f, src = s.src;
        return c => {
          c.rt.test.asserts++;
          if (!fc(c)) {
            let m = `ASSERT ${src} fehlgeschlagen`;
            if (detail) m += ` (${detail(c)})`;
            if (msg) m = `${msg.f(c)} – ${m}`;
            throw new TestFailure(m, loc);
          }
          return 0;
        };
      }
      case 'rununtil': {
        const cnd = this.compileExpr(s.cond, scope);
        if (!cnd) return null;
        if (!T.isBool(cnd.t)) { this.error('RUN_UNTIL erwartet einen BOOL-Ausdruck', s.cond); return null; }
        const to = s.timeout ? this.compileExpr(s.timeout, scope) : { t: E.TIME, f: () => 10000 };
        if (!to) return null;
        if (!T.isTime(to.t)) { this.error('TIMEOUT erwartet eine Zeit', s.timeout); return null; }
        const fc = cnd.f, ft = to.f;
        return c => { c.rt.test.asserts++; c.rt.test.runUntil(() => fc(c), ft(c), loc); return 0; };
      }
      case 'log': {
        const args = s.args.map(a => this.compileExpr(a, scope));
        if (args.some(a => !a)) return null;
        return c => {
          c.rt.test.log(args.map(a => (T.isStr(a.t) ? a.f(c) : fmtValue(a.t, a.f(c)))).join(' '), loc);
          return 0;
        };
      }
    }
    return null;
  };

;globalThis.ST_EXAMPLES = [{"name":"Säge – manuell schalten (Unit-Tests)","prog":"\n\nVAR_GLOBAL\n    E0  : BOOL;  (* S0  Rohr an Anschlag 1 *)\n    E1  : BOOL;  (* S1  Rohr an Anschlag 2 *)\n    E2  : BOOL;  (* S2  gespannt *)\n    E3  : BOOL;  (* S3  entspannt *)\n    E4  : BOOL;  (* S4  Säge oben *)\n    E5  : BOOL;  (* S5  Säge unten *)\n    E6  : BOOL;  (* S6  Anschlag 1 oben *)\n    E7  : BOOL;  (* S7  Anschlag 1 unten *)\n    E8  : BOOL;  (* S8  EIN *)\n    E9  : BOOL;  (* S9  AUS, Öffner *)\n    E10 : BOOL;  (* S10 Start *)\n    E11 : BOOL;  (* S11 Stopp, Öffner *)\n    E12 : BOOL;  (* S12 Anschlag 2 oben *)\n    E13 : BOOL;  (* S13 Anschlag 2 unten *)\n    E14 : BOOL;  (* S14 dickes Rohr *)\n    E15 : BOOL;  (* S15 dünnes Rohr *)\n    WST_ABTRANSPORT      : BOOL;  (* B1 *)\n    mot_schutz_saege     : BOOL;  (* F1..F5 Öffner *)\n    mot_schutz_rolle1    : BOOL;\n    mot_schutz_rolle2    : BOOL;\n    mot_schutz_anschlag1 : BOOL;\n    mot_schutz_anschlag2 : BOOL;\n\n    SAEGE_RUNTER     : BOOL;  (* A1 *)\n    SAEGE_HOCH       : BOOL;  (* A2 *)\n    SPANNEN          : BOOL;  (* A3 *)\n    ENTSPANNEN       : BOOL;  (* A4 *)\n    SAEGE_ANTRIEB    : BOOL;  (* K1 *)\n    ROLLE_1          : BOOL;  (* K2 *)\n    ROLLE_2          : BOOL;  (* K3 *)\n    ANSCHLAG1_HOCH   : BOOL;  (* K4 *)\n    ANSCHLAG1_RUNTER : BOOL;  (* K5 *)\n    ANSCHLAG2_HOCH   : BOOL;  (* K6 *)\n    ANSCHLAG2_RUNTER : BOOL;  (* K7 *)\nEND_VAR\n\n\nFUNCTION_BLOCK FB_Betriebsart\nVAR_OUTPUT\n    xEin      : BOOL;\n    xAuto     : BOOL;\n    xStoerung : BOOL;\nEND_VAR\n\nxStoerung := NOT (mot_schutz_saege AND mot_schutz_rolle1 AND mot_schutz_rolle2\n                  AND mot_schutz_anschlag1 AND mot_schutz_anschlag2);\n\nIF E8 THEN xEin := TRUE;END_IF\nIF NOT E9 OR xStoerung THEN xEin := FALSE; END_IF\n\n(* Stopp: laufendes Rohr wird fertig bearbeitet *)\nIF E10 AND xEin THEN xAuto := TRUE; END_IF\nIF NOT E11 OR NOT xEin THEN xAuto := FALSE; END_IF\nEND_FUNCTION_BLOCK\n\n\n\nPROGRAM SFC_Saege\nVAR_INPUT\n    xAuto      : BOOL;\n    xB1_Flanke : BOOL;\n    xReset     : BOOL;   (* zurueck in Grundstellung S1 *)\nEND_VAR\nVAR\n    iStep     : INT := 1;\n    iStepOld  : INT := 0;\n    xNeu      : BOOL;    (* Schritt wurde in diesem Zyklus betreten *)\n    xDuenn    : BOOL;\n    xDick     : BOOL;\n    iSoll     : INT;\n    iZaehler  : INT;\n    xK1, xK2, xK3, xK5, xK7 : BOOL;\n    xAbtransport : BOOL;\n    xA1, xA2, xA3, xA4 : BOOL;\nEND_VAR\n\n(* Reset *)\nIF xReset THEN\n    iStep    := 1;\n    iZaehler := 0;\n    xDuenn   := FALSE;\n    xDick    := FALSE;\nEND_IF\n\n\nxNeu     := (iStep <> iStepOld);\niStepOld := iStep;\n(* Start *)\nIF xNeu THEN\n    CASE iStep OF\n        2:  (* ACT_Rohrtyp *)\n            xDuenn := E15;\n            xDick  := E14 AND NOT E15;\n            IF xDuenn THEN iSoll := 4; ELSE iSoll := 3; END_IF\n        10: (* ACT_Zaehlen *)\n            iZaehler := iZaehler + 1;\n        11: (* ACT_Ruecksetzen *)\n            iZaehler := 0;\n            xDuenn   := FALSE;\n            xDick    := FALSE;\n    END_CASE\nEND_IF\n\n(*Schrittekette *)\nCASE iStep OF\n    1:  IF xAuto AND E3 AND E4 AND E6 AND E12 AND (E14 OR E15) THEN iStep := 2;  END_IF\n    2:  IF xDuenn THEN iStep := 3;\n        ELSIF xDick THEN iStep := 4; END_IF\n    3:  IF E7  THEN iStep := 5; END_IF\n    4:  IF E13 THEN iStep := 5; END_IF\n    5:  IF (xDuenn AND E0) OR (xDick AND E1) THEN iStep := 6; END_IF\n    6:  IF E2  THEN iStep := 7; END_IF\n    7:  IF E5  THEN iStep := 8; END_IF\n    8:  IF E4  THEN iStep := 9; END_IF\n    9:  IF E3  THEN iStep := 10; END_IF\n    10: IF WST_ABTRANSPORT AND E6 AND E12 THEN\n            IF iZaehler < iSoll THEN\n                IF xDuenn THEN iStep := 3; ELSE iStep := 4; END_IF\n            ELSE\n                iStep := 11;\n            END_IF\n        END_IF\n    11: IF xB1_Flanke THEN iStep := 1; END_IF\nEND_CASE\n\n(* Schrittverriegelungen*)\nxK1          := (iStep = 7) OR (iStep = 8);\nxK2          := (iStep = 5) OR (iStep = 11);\nxK3          := (iStep = 5) OR (iStep = 10) OR (iStep = 11);\nxK5          := (iStep = 3);\nxK7          := (iStep = 4);\nxA1          := (iStep = 7);\nxA2          := (iStep = 8);\nxA3          := (iStep = 6);\nxA4          := (iStep = 9);\nxAbtransport := (iStep = 10);\nEND_PROGRAM\n\n\nPROGRAM PRG_Ausgaenge\nVAR_INPUT\n    xFreigabe : BOOL;\nEND_VAR\n\nROLLE_1          := xFreigabe AND SFC_Saege.xK2 AND E3;\nROLLE_2          := xFreigabe AND SFC_Saege.xK3;\nSPANNEN          := xFreigabe AND SFC_Saege.xA3 AND NOT SFC_Saege.xA4;\nENTSPANNEN       := xFreigabe AND SFC_Saege.xA4 AND E4;\nSAEGE_ANTRIEB    := xFreigabe AND SFC_Saege.xK1 AND E2;\nSAEGE_RUNTER     := xFreigabe AND SFC_Saege.xA1 AND E2 AND NOT SFC_Saege.xA2;\nSAEGE_HOCH       := xFreigabe AND SFC_Saege.xA2;\nANSCHLAG1_HOCH   := xFreigabe AND SFC_Saege.xAbtransport AND SFC_Saege.xDuenn;\nANSCHLAG2_HOCH   := xFreigabe AND SFC_Saege.xAbtransport AND SFC_Saege.xDick;\nANSCHLAG1_RUNTER := xFreigabe AND SFC_Saege.xK5 AND NOT ANSCHLAG1_HOCH;\nANSCHLAG2_RUNTER := xFreigabe AND SFC_Saege.xK7 AND NOT ANSCHLAG2_HOCH;\nEND_PROGRAM\n\n\nPROGRAM PLC_PRG\nVAR\n    fbBetriebsart : FB_Betriebsart;\n    rtB1          : R_TRIG;\nEND_VAR\n\nfbBetriebsart();\nrtB1(CLK := WST_ABTRANSPORT);\n\nSFC_Saege(xAuto := fbBetriebsart.xAuto, xB1_Flanke := rtB1.Q, xReset := NOT fbBetriebsart.xEin);\n\nPRG_Ausgaenge(xFreigabe := fbBetriebsart.xEin AND NOT fbBetriebsart.xStoerung);\nEND_PROGRAM\n","model":"(* ============================================================\n   Anlagenmodell Rohrsäge  –  läuft im Simulator in jedem Zyklus\n   VOR dem SPS-Programm und bildet die Sensoren (E0..E15, B1)\n   aus den Ausgängen (A1..A4, K1..K7) nach.\n\n   Geometrie (mm, ab Sägeblatt):  Anschlag 1 = 300, Anschlag 2 = 500,\n   Lichtschranke B1 = 1500.  Rohrlänge 1700 mm.\n   ============================================================ *)\n\nPROGRAM SIM_Saege\nVAR_INPUT\n    xNaechstesDick : BOOL := FALSE;   (* Typ des nächsten Rohres *)\n    xNachladen     : BOOL := TRUE;    (* automatisch neues Rohr auflegen *)\nEND_VAR\nVAR_OUTPUT\n    iSchnitte      : INT;             (* Anzahl Schnitte gesamt *)\n    iAbtransport   : INT;             (* Teile, die die Anlage verlassen haben *)\n    iRohre         : INT;             (* aufgelegte Rohre *)\n    xKollision     : BOOL;            (* mechanische Kollision erkannt *)\n    sKollision     : STRING;\nEND_VAR\nVAR CONSTANT\n    POS_A1   : REAL := 300.0;\n    POS_A2   : REAL := 500.0;\n    POS_B1   : REAL := 1500.0;\n    ROHR_LEN : REAL := 1700.0;\n    V_ROLLE  : REAL := 0.5;     (* mm/ms *)\n    V_SAEGE  : REAL := 0.1;     (* %/ms  -> 1 s Hub *)\n    V_SPANN  : REAL := 0.4;     (* %/ms  -> 250 ms *)\n    V_ANSCHL : REAL := 0.25;    (* %/ms  -> 400 ms *)\n    MAX_TEILE : INT := 8;\nEND_VAR\nVAR\n    xInit      : BOOL;\n    tLast      : TIME;\n    dt         : REAL;\n    rSaege     : REAL := 100.0;  (* 100 = oben, 0 = unten *)\n    rSpann     : REAL := 0.0;    (* 0 = entspannt, 100 = gespannt *)\n    rAnschlag1 : REAL := 0.0;    (* 0 = oben, 100 = unten *)\n    rAnschlag2 : REAL := 0.0;\n    xRohrDick  : BOOL;\n    rRohrFront : REAL;           (* Rohranfang hinter dem Sägeblatt *)\n    rRohrLen   : REAL;           (* Restlänge auf der Zuführung *)\n    aFront     : ARRAY[1..8] OF REAL;   (* abgesägte Teile auf Rollenbahn 2 *)\n    aLen       : ARRAY[1..8] OF REAL;\n    nTeile     : INT;\n    xGeschnitten : BOOL;\n    tonLaden   : TON;\n    i, k       : INT;\n    rWeg, rHinten : REAL;\nEND_VAR\n\n(* ---------- Initialisierung beim ersten Zyklus ---------- *)\nIF NOT xInit THEN\n    xInit := TRUE;\n    tLast := TIME();\n    E9 := TRUE;  E11 := TRUE;   (* Öffner nicht betätigt *)\n    mot_schutz_saege := TRUE;  mot_schutz_rolle1 := TRUE;  mot_schutz_rolle2 := TRUE;\n    mot_schutz_anschlag1 := TRUE;  mot_schutz_anschlag2 := TRUE;\nEND_IF\ndt := TIME_TO_REAL(TIME() - tLast);\ntLast := TIME();\n\n(* ---------- Säge ---------- *)\nIF SAEGE_RUNTER AND NOT SAEGE_HOCH THEN\n    rSaege := MAX(0.0, rSaege - V_SAEGE * dt);\nELSIF SAEGE_HOCH AND NOT SAEGE_RUNTER THEN\n    rSaege := MIN(100.0, rSaege + V_SAEGE * dt);\nEND_IF\nIF rSaege < 60.0 AND rRohrLen > 0.0 AND NOT SAEGE_ANTRIEB AND NOT xKollision THEN\n    xKollision := TRUE;  sKollision := 'Säge fährt ohne Antrieb ins Rohr';\nEND_IF\nIF rSaege < 60.0 AND rRohrLen > 0.0 AND rSpann < 100.0 AND NOT xKollision THEN\n    xKollision := TRUE;  sKollision := 'Sägen ohne gespanntes Rohr';\nEND_IF\n\n(* ---------- Spannbacken ---------- *)\nIF SPANNEN AND NOT ENTSPANNEN THEN\n    rSpann := MIN(100.0, rSpann + V_SPANN * dt);\nELSIF ENTSPANNEN AND NOT SPANNEN THEN\n    rSpann := MAX(0.0, rSpann - V_SPANN * dt);\nEND_IF\n\n(* ---------- Längenanschläge ---------- *)\nIF ANSCHLAG1_RUNTER AND NOT ANSCHLAG1_HOCH THEN rAnschlag1 := MIN(100.0, rAnschlag1 + V_ANSCHL * dt);\nELSIF ANSCHLAG1_HOCH AND NOT ANSCHLAG1_RUNTER THEN rAnschlag1 := MAX(0.0, rAnschlag1 - V_ANSCHL * dt); END_IF\nIF ANSCHLAG2_RUNTER AND NOT ANSCHLAG2_HOCH THEN rAnschlag2 := MIN(100.0, rAnschlag2 + V_ANSCHL * dt);\nELSIF ANSCHLAG2_HOCH AND NOT ANSCHLAG2_RUNTER THEN rAnschlag2 := MAX(0.0, rAnschlag2 - V_ANSCHL * dt); END_IF\n\n(* Anschlag fährt auf ein Teil, das unter ihm liegt? *)\nFOR i := 1 TO nTeile DO\n    rHinten := aFront[i] - aLen[i];\n    IF ANSCHLAG1_RUNTER AND rHinten < POS_A1 - 1.0 AND aFront[i] > POS_A1 + 1.0 AND NOT xKollision THEN\n        xKollision := TRUE;  sKollision := 'Anschlag 1 fährt auf ein Teil';\n    END_IF\n    IF ANSCHLAG2_RUNTER AND rHinten < POS_A2 - 1.0 AND aFront[i] > POS_A2 + 1.0 AND NOT xKollision THEN\n        xKollision := TRUE;  sKollision := 'Anschlag 2 fährt auf ein Teil';\n    END_IF\nEND_FOR\n\nIF ANSCHLAG1_RUNTER AND rRohrLen > 0.0 AND rRohrFront > POS_A1 + 1.0 AND NOT xKollision THEN\n    xKollision := TRUE;  sKollision := 'Anschlag 1 fährt auf das Rohr';\nEND_IF\nIF ANSCHLAG2_RUNTER AND rRohrLen > 0.0 AND rRohrFront > POS_A2 + 1.0 AND NOT xKollision THEN\n    xKollision := TRUE;  sKollision := 'Anschlag 2 fährt auf das Rohr';\nEND_IF\n\n(* ---------- Rohr auf der Zuführung (Rollenbahn 1) ---------- *)\nIF ROLLE_1 AND rRohrLen > 0.0 THEN\n    IF rSpann > 0.0 THEN\n        IF NOT xKollision THEN xKollision := TRUE; sKollision := 'Vorschub gegen gespanntes Rohr'; END_IF\n    ELSE\n        rWeg := V_ROLLE * dt;\n        rRohrFront := rRohrFront + rWeg;\n        IF rAnschlag1 > 0.0 AND rRohrFront - rWeg <= POS_A1 + 0.01 THEN rRohrFront := MIN(rRohrFront, POS_A1); END_IF\n        IF rAnschlag2 > 0.0 AND rRohrFront - rWeg <= POS_A2 + 0.01 THEN rRohrFront := MIN(rRohrFront, POS_A2); END_IF\n        (* Rohrende hat die Säge passiert -> Reststück auf Rollenbahn 2 *)\n        IF rRohrFront >= rRohrLen AND nTeile < MAX_TEILE THEN\n            nTeile := nTeile + 1;\n            aFront[nTeile] := rRohrFront;  aLen[nTeile] := rRohrLen;\n            rRohrLen := 0.0;  rRohrFront := 0.0;\n        END_IF\n    END_IF\nEND_IF\n\n(* ---------- Schnitt ---------- *)\nIF SAEGE_ANTRIEB AND rSaege <= 0.0 AND rSpann >= 100.0 AND NOT xGeschnitten AND rRohrFront > 0.0 AND nTeile < MAX_TEILE THEN\n    xGeschnitten := TRUE;\n    iSchnitte := iSchnitte + 1;\n    nTeile := nTeile + 1;\n    aFront[nTeile] := rRohrFront;  aLen[nTeile] := rRohrFront;\n    rRohrLen := rRohrLen - rRohrFront;\n    rRohrFront := 0.0;\nEND_IF\nIF rSaege >= 100.0 THEN xGeschnitten := FALSE; END_IF\n\n(* ---------- Teile auf Rollenbahn 2 ---------- *)\nIF ROLLE_2 THEN\n    rWeg := V_ROLLE * dt;\n    FOR i := 1 TO nTeile DO\n        aFront[i] := aFront[i] + rWeg;\n        IF rAnschlag1 > 0.0 AND aFront[i] - rWeg <= POS_A1 + 0.01 THEN aFront[i] := MIN(aFront[i], POS_A1); END_IF\n        IF rAnschlag2 > 0.0 AND aFront[i] - rWeg <= POS_A2 + 0.01 THEN aFront[i] := MIN(aFront[i], POS_A2); END_IF\n    END_FOR\nEND_IF\n(* Teile, die die Rollenbahn verlassen haben, entfernen *)\ni := 1;\nWHILE i <= nTeile DO\n    IF aFront[i] - aLen[i] > POS_B1 + 300.0 THEN\n        FOR k := i TO nTeile - 1 DO\n            aFront[k] := aFront[k + 1];  aLen[k] := aLen[k + 1];\n        END_FOR\n        nTeile := nTeile - 1;\n        iAbtransport := iAbtransport + 1;\n    ELSE\n        i := i + 1;\n    END_IF\nEND_WHILE\n\n(* ---------- Rohr nachladen ---------- *)\ntonLaden(IN := xNachladen AND rRohrLen <= 0.0 AND NOT ROLLE_1, PT := T#1s);   (* Werker legt nur bei stehender Bahn auf *)\nIF tonLaden.Q THEN\n    rRohrLen := ROHR_LEN;  rRohrFront := 0.0;\n    xRohrDick := xNaechstesDick;\n    iRohre := iRohre + 1;\nEND_IF\n\n(* ---------- Sensoren ---------- *)\nE0  := rRohrLen > 0.0 AND rAnschlag1 >= 100.0 AND rRohrFront >= POS_A1 - 0.5;\nE1  := rRohrLen > 0.0 AND rAnschlag2 >= 100.0 AND rRohrFront >= POS_A2 - 0.5;\nE2  := rSpann >= 100.0;\nE3  := rSpann <= 0.0;\nE4  := rSaege >= 100.0;\nE5  := rSaege <= 0.0;\nE6  := rAnschlag1 <= 0.0;\nE7  := rAnschlag1 >= 100.0;\nE12 := rAnschlag2 <= 0.0;\nE13 := rAnschlag2 >= 100.0;\nE14 := rRohrLen > 0.0 AND xRohrDick;\nE15 := rRohrLen > 0.0 AND NOT xRohrDick;\nWST_ABTRANSPORT := FALSE;\nFOR i := 1 TO nTeile DO\n    IF aFront[i] >= POS_B1 AND aFront[i] - aLen[i] <= POS_B1 THEN WST_ABTRANSPORT := TRUE; END_IF\nEND_FOR\nEND_PROGRAM\n","tests":"(* ============================================================\n   Unit-Tests für Saege_CODESYS.st  (ohne Anlagenmodell)\n   Prüft die Ablaufkette gemäß SFC (Schritte 1..11) und die\n   Betriebsarten. Sensoren werden direkt im Test gesetzt.\n\n   Syntax:  CYCLE [n];  WAIT T#..;  ASSERT ausdruck [, 'Text'];\n            RUN_UNTIL bedingung [TIMEOUT T#..];  LOG ...;\n   ============================================================ *)\n\nSETUP\n    (* Öffner und Motorschutz im Normalzustand = TRUE *)\n    E9  := TRUE;  E11 := TRUE;\n    mot_schutz_saege := TRUE;  mot_schutz_rolle1 := TRUE;  mot_schutz_rolle2 := TRUE;\n    mot_schutz_anschlag1 := TRUE;  mot_schutz_anschlag2 := TRUE;\n    (* Grundstellung der Mechanik *)\n    E3 := TRUE;  E4 := TRUE;  E6 := TRUE;  E12 := TRUE;\nEND_SETUP\n\n\nTEST 'Grundstellung: Schritt 1, alle Ausgänge aus'\n    CYCLE 5;\n    ASSERT SFC_Saege.iStep = 1;\n    ASSERT NOT (SAEGE_RUNTER OR SAEGE_HOCH OR SPANNEN OR ENTSPANNEN OR SAEGE_ANTRIEB\n                OR ROLLE_1 OR ROLLE_2 OR ANSCHLAG1_HOCH OR ANSCHLAG1_RUNTER\n                OR ANSCHLAG2_HOCH OR ANSCHLAG2_RUNTER), 'Ausgang aktiv in Grundstellung';\nEND_TEST\n\n\nTEST 'EIN (S8) / AUS (S9, Öffner)'\n    CYCLE;\n    ASSERT fbBetriebsart.xEin = FALSE;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;  CYCLE;\n    ASSERT fbBetriebsart.xEin, 'EIN muss selbsthaltend sein';\n    E9 := FALSE; CYCLE;\n    ASSERT NOT fbBetriebsart.xEin, 'AUS (Öffner) muss ausschalten';\n    E9 := TRUE;  CYCLE;\n    ASSERT NOT fbBetriebsart.xEin, 'nach AUS erst wieder mit EIN';\nEND_TEST\n\n\nTEST 'AUS hat Vorrang vor EIN'\n    E8 := TRUE;  E9 := FALSE;  CYCLE;\n    ASSERT NOT fbBetriebsart.xEin;\nEND_TEST\n\n\nTEST 'START (S10) nur wenn EIN'\n    E10 := TRUE;  CYCLE;\n    ASSERT NOT fbBetriebsart.xAuto, 'Automatik ohne EIN';\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE; CYCLE;\n    ASSERT fbBetriebsart.xAuto;\n    E11 := FALSE; CYCLE;  E11 := TRUE;\n    ASSERT NOT fbBetriebsart.xAuto, 'STOPP (Öffner) muss Automatik beenden';\nEND_TEST\n\n\nTEST 'Motorschutz löst Störung aus und schaltet AUS'\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    ASSERT fbBetriebsart.xEin;\n    mot_schutz_rolle2 := FALSE;  CYCLE;\n    ASSERT fbBetriebsart.xStoerung;\n    ASSERT NOT fbBetriebsart.xEin;\n    E8 := TRUE;  CYCLE;\n    ASSERT NOT fbBetriebsart.xEin, 'EIN darf bei Störung nicht wirken';\nEND_TEST\n\n\nTEST 'Kein Start ohne Rohr (E14/E15)'\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    CYCLE 10;\n    ASSERT SFC_Saege.iStep = 1;\nEND_TEST\n\n\nTEST 'Kein Start wenn Säge nicht oben (E4)'\n    E4 := FALSE;  E15 := TRUE;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    CYCLE 10;\n    ASSERT SFC_Saege.iStep = 1;\nEND_TEST\n\n\nTEST 'Ablauf dünnes Rohr: 4 Schnitte, Schritt 11, zurück zu 1'\nVAR n : INT; END_VAR\n    E15 := TRUE;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    RUN_UNTIL SFC_Saege.iStep = 3 TIMEOUT T#100ms;\n    ASSERT SFC_Saege.xDuenn AND NOT SFC_Saege.xDick;\n    ASSERT SFC_Saege.iSoll = 4;\n\n    FOR n := 1 TO 4 DO\n        (* Schritt 3: Anschlag 1 runter *)\n        ASSERT SFC_Saege.iStep = 3;\n        ASSERT ANSCHLAG1_RUNTER AND NOT ANSCHLAG2_RUNTER;\n        E6 := FALSE;  E7 := TRUE;  CYCLE;\n        (* Schritt 5: Rollenbahnen 1+2 *)\n        ASSERT SFC_Saege.iStep = 5;\n        ASSERT ROLLE_1 AND ROLLE_2 AND NOT ANSCHLAG1_RUNTER;\n        WST_ABTRANSPORT := FALSE;\n        E1 := TRUE;  CYCLE;\n        ASSERT SFC_Saege.iStep = 5, 'dünnes Rohr darf nicht auf E1 (Anschlag 2) reagieren';\n        E1 := FALSE;\n        E0 := TRUE;  CYCLE;\n        (* Schritt 6: spannen *)\n        ASSERT SFC_Saege.iStep = 6;\n        ASSERT SPANNEN AND NOT ROLLE_1;\n        E3 := FALSE;  E2 := TRUE;  CYCLE;\n        (* Schritt 7: Säge an + runter *)\n        ASSERT SFC_Saege.iStep = 7;\n        ASSERT SAEGE_ANTRIEB AND SAEGE_RUNTER AND NOT SPANNEN;\n        E4 := FALSE;  E5 := TRUE;  CYCLE;\n        (* Schritt 8: Säge an + hoch *)\n        ASSERT SFC_Saege.iStep = 8;\n        ASSERT SAEGE_ANTRIEB AND SAEGE_HOCH AND NOT SAEGE_RUNTER;\n        E5 := FALSE;  E4 := TRUE;  CYCLE;\n        (* Schritt 9: entspannen *)\n        ASSERT SFC_Saege.iStep = 9;\n        ASSERT ENTSPANNEN AND NOT SAEGE_ANTRIEB;\n        E2 := FALSE;  E3 := TRUE;  CYCLE;\n        (* Schritt 10: zählen, Anschlag 1 hoch, Abtransport *)\n        ASSERT SFC_Saege.iStep = 10;\n        CYCLE;\n        ASSERT SFC_Saege.iZaehler = n, 'Zähler';\n        ASSERT ANSCHLAG1_HOCH AND NOT ANSCHLAG2_HOCH AND ROLLE_2;\n        E0 := FALSE;  E7 := FALSE;  E6 := TRUE;\n        CYCLE;\n        ASSERT SFC_Saege.iStep = 10, 'ohne B1 kein Weiterschalten';\n        WST_ABTRANSPORT := TRUE;  CYCLE;\n    END_FOR\n\n    (* nach dem 4. Schnitt: Schritt 11 Reststück *)\n    ASSERT SFC_Saege.iStep = 11;\n    CYCLE;\n    ASSERT ROLLE_1 AND ROLLE_2;\n    ASSERT SFC_Saege.iZaehler = 0 AND NOT SFC_Saege.xDuenn;\n    (* B1 ist noch belegt -> erst steigende Flanke schaltet weiter *)\n    CYCLE 5;\n    ASSERT SFC_Saege.iStep = 11, 'Dauersignal B1 darf nicht weiterschalten';\n    WST_ABTRANSPORT := FALSE;  CYCLE;\n    WST_ABTRANSPORT := TRUE;   CYCLE;\n    ASSERT SFC_Saege.iStep = 1;\nEND_TEST\n\n\nTEST 'Ablauf dickes Rohr: Anschlag 2, 3 Schnitte'\nVAR n : INT; END_VAR\n    E14 := TRUE;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    RUN_UNTIL SFC_Saege.iStep = 4 TIMEOUT T#100ms;\n    ASSERT SFC_Saege.xDick AND SFC_Saege.iSoll = 3;\n    FOR n := 1 TO 3 DO\n        ASSERT SFC_Saege.iStep = 4;\n        ASSERT ANSCHLAG2_RUNTER AND NOT ANSCHLAG1_RUNTER;\n        E12 := FALSE;  E13 := TRUE;  CYCLE;\n        ASSERT SFC_Saege.iStep = 5;\n        E0 := TRUE;  CYCLE;\n        ASSERT SFC_Saege.iStep = 5, 'dickes Rohr darf nicht auf E0 reagieren';\n        E0 := FALSE;  E1 := TRUE;  CYCLE;\n        E3 := FALSE;  E2 := TRUE;  CYCLE;\n        E4 := FALSE;  E5 := TRUE;  CYCLE;\n        E5 := FALSE;  E4 := TRUE;  CYCLE;\n        E2 := FALSE;  E3 := TRUE;  CYCLE;\n        ASSERT SFC_Saege.iStep = 10;\n        CYCLE;\n        ASSERT ANSCHLAG2_HOCH AND NOT ANSCHLAG1_HOCH;\n        E1 := FALSE;  E13 := FALSE;  E12 := TRUE;\n        WST_ABTRANSPORT := TRUE;  CYCLE;\n        WST_ABTRANSPORT := FALSE;\n    END_FOR\n    ASSERT SFC_Saege.iStep = 11;\nEND_TEST\n\n\nTEST 'STOPP: laufendes Rohr wird fertig bearbeitet'\n    E15 := TRUE;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    RUN_UNTIL SFC_Saege.iStep = 3 TIMEOUT T#100ms;\n    E11 := FALSE;  CYCLE;  E11 := TRUE;     (* STOPP gedrückt *)\n    ASSERT NOT fbBetriebsart.xAuto;\n    E6 := FALSE;  E7 := TRUE;  CYCLE;\n    ASSERT SFC_Saege.iStep = 5, 'Kette muss nach STOPP weiterlaufen';\n    ASSERT ROLLE_1;\nEND_TEST\n\n\nTEST 'AUS während Ablauf: zurück in Grundstellung, Ausgänge aus'\n    E15 := TRUE;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    RUN_UNTIL SFC_Saege.iStep = 3 TIMEOUT T#100ms;\n    E6 := FALSE;  E7 := TRUE;  CYCLE;\n    ASSERT ROLLE_1;\n    E9 := FALSE;  CYCLE;\n    ASSERT SFC_Saege.iStep = 1;\n    ASSERT NOT ROLLE_1 AND NOT ROLLE_2, 'Ausgänge müssen bei AUS abfallen';\nEND_TEST\n\n\nTEST 'Nach Schritt 11 neuer Durchlauf nur mit Automatik'\n    (* Schritt 11 direkt anfahren *)\n    E15 := TRUE;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    SFC_Saege.iStep := 11;  CYCLE;\n    E11 := FALSE;  CYCLE;  E11 := TRUE;     (* Automatik aus *)\n    WST_ABTRANSPORT := TRUE;  CYCLE;\n    ASSERT SFC_Saege.iStep = 1;\n    CYCLE 10;\n    ASSERT SFC_Saege.iStep = 1, 'ohne START kein neuer Zyklus';\nEND_TEST\n\n\nTEST 'Schritt 10: B1 noch vom vorherigen Teil belegt darf nicht weiterschalten'\n    (* Liegt das alte Teil/Reststück noch auf B1, wenn Schritt 10 erreicht wird,\n       darf die Kette erst weiter, wenn das NEUE Teil B1 erreicht (Flanke). *)\n    E15 := TRUE;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    RUN_UNTIL SFC_Saege.iStep = 3 TIMEOUT T#100ms;\n    WST_ABTRANSPORT := TRUE;              (* altes Teil liegt dauerhaft auf B1 *)\n    E6 := FALSE;  E7 := TRUE;  CYCLE;\n    E0 := TRUE;   CYCLE;\n    E3 := FALSE;  E2 := TRUE;  CYCLE;\n    E4 := FALSE;  E5 := TRUE;  CYCLE;\n    E5 := FALSE;  E4 := TRUE;  CYCLE;\n    E2 := FALSE;  E3 := TRUE;  CYCLE;\n    ASSERT SFC_Saege.iStep = 10;\n    E0 := FALSE;  E7 := FALSE;  E6 := TRUE;     (* Anschlag 1 wieder oben *)\n    CYCLE 3;\n    ASSERT SFC_Saege.iStep = 10, 'Kette schaltet mit altem Teil auf B1 weiter – Anschlag 1 würde auf das neue Teil fahren';\nEND_TEST\n","modelOn":false,"files":{"prog":"Saege_CODESYS.st","model":"Saege_Anlage.st","tests":"Saege_Tests.sttest"}},{"name":"Säge – mit Anlagenmodell (Integrationstests)","prog":"\n\nVAR_GLOBAL\n    E0  : BOOL;  (* S0  Rohr an Anschlag 1 *)\n    E1  : BOOL;  (* S1  Rohr an Anschlag 2 *)\n    E2  : BOOL;  (* S2  gespannt *)\n    E3  : BOOL;  (* S3  entspannt *)\n    E4  : BOOL;  (* S4  Säge oben *)\n    E5  : BOOL;  (* S5  Säge unten *)\n    E6  : BOOL;  (* S6  Anschlag 1 oben *)\n    E7  : BOOL;  (* S7  Anschlag 1 unten *)\n    E8  : BOOL;  (* S8  EIN *)\n    E9  : BOOL;  (* S9  AUS, Öffner *)\n    E10 : BOOL;  (* S10 Start *)\n    E11 : BOOL;  (* S11 Stopp, Öffner *)\n    E12 : BOOL;  (* S12 Anschlag 2 oben *)\n    E13 : BOOL;  (* S13 Anschlag 2 unten *)\n    E14 : BOOL;  (* S14 dickes Rohr *)\n    E15 : BOOL;  (* S15 dünnes Rohr *)\n    WST_ABTRANSPORT      : BOOL;  (* B1 *)\n    mot_schutz_saege     : BOOL;  (* F1..F5 Öffner *)\n    mot_schutz_rolle1    : BOOL;\n    mot_schutz_rolle2    : BOOL;\n    mot_schutz_anschlag1 : BOOL;\n    mot_schutz_anschlag2 : BOOL;\n\n    SAEGE_RUNTER     : BOOL;  (* A1 *)\n    SAEGE_HOCH       : BOOL;  (* A2 *)\n    SPANNEN          : BOOL;  (* A3 *)\n    ENTSPANNEN       : BOOL;  (* A4 *)\n    SAEGE_ANTRIEB    : BOOL;  (* K1 *)\n    ROLLE_1          : BOOL;  (* K2 *)\n    ROLLE_2          : BOOL;  (* K3 *)\n    ANSCHLAG1_HOCH   : BOOL;  (* K4 *)\n    ANSCHLAG1_RUNTER : BOOL;  (* K5 *)\n    ANSCHLAG2_HOCH   : BOOL;  (* K6 *)\n    ANSCHLAG2_RUNTER : BOOL;  (* K7 *)\nEND_VAR\n\n\nFUNCTION_BLOCK FB_Betriebsart\nVAR_OUTPUT\n    xEin      : BOOL;\n    xAuto     : BOOL;\n    xStoerung : BOOL;\nEND_VAR\n\nxStoerung := NOT (mot_schutz_saege AND mot_schutz_rolle1 AND mot_schutz_rolle2\n                  AND mot_schutz_anschlag1 AND mot_schutz_anschlag2);\n\nIF E8 THEN xEin := TRUE;END_IF\nIF NOT E9 OR xStoerung THEN xEin := FALSE; END_IF\n\n(* Stopp: laufendes Rohr wird fertig bearbeitet *)\nIF E10 AND xEin THEN xAuto := TRUE; END_IF\nIF NOT E11 OR NOT xEin THEN xAuto := FALSE; END_IF\nEND_FUNCTION_BLOCK\n\n\n\nPROGRAM SFC_Saege\nVAR_INPUT\n    xAuto      : BOOL;\n    xB1_Flanke : BOOL;\n    xReset     : BOOL;   (* zurueck in Grundstellung S1 *)\nEND_VAR\nVAR\n    iStep     : INT := 1;\n    iStepOld  : INT := 0;\n    xNeu      : BOOL;    (* Schritt wurde in diesem Zyklus betreten *)\n    xDuenn    : BOOL;\n    xDick     : BOOL;\n    iSoll     : INT;\n    iZaehler  : INT;\n    xK1, xK2, xK3, xK5, xK7 : BOOL;\n    xAbtransport : BOOL;\n    xA1, xA2, xA3, xA4 : BOOL;\nEND_VAR\n\n(* Reset *)\nIF xReset THEN\n    iStep    := 1;\n    iZaehler := 0;\n    xDuenn   := FALSE;\n    xDick    := FALSE;\nEND_IF\n\n\nxNeu     := (iStep <> iStepOld);\niStepOld := iStep;\n(* Start *)\nIF xNeu THEN\n    CASE iStep OF\n        2:  (* ACT_Rohrtyp *)\n            xDuenn := E15;\n            xDick  := E14 AND NOT E15;\n            IF xDuenn THEN iSoll := 4; ELSE iSoll := 3; END_IF\n        10: (* ACT_Zaehlen *)\n            iZaehler := iZaehler + 1;\n        11: (* ACT_Ruecksetzen *)\n            iZaehler := 0;\n            xDuenn   := FALSE;\n            xDick    := FALSE;\n    END_CASE\nEND_IF\n\n(*Schrittekette *)\nCASE iStep OF\n    1:  IF xAuto AND E3 AND E4 AND E6 AND E12 AND (E14 OR E15) THEN iStep := 2;  END_IF\n    2:  IF xDuenn THEN iStep := 3;\n        ELSIF xDick THEN iStep := 4; END_IF\n    3:  IF E7  THEN iStep := 5; END_IF\n    4:  IF E13 THEN iStep := 5; END_IF\n    5:  IF (xDuenn AND E0) OR (xDick AND E1) THEN iStep := 6; END_IF\n    6:  IF E2  THEN iStep := 7; END_IF\n    7:  IF E5  THEN iStep := 8; END_IF\n    8:  IF E4  THEN iStep := 9; END_IF\n    9:  IF E3  THEN iStep := 10; END_IF\n    10: IF WST_ABTRANSPORT AND E6 AND E12 THEN\n            IF iZaehler < iSoll THEN\n                IF xDuenn THEN iStep := 3; ELSE iStep := 4; END_IF\n            ELSE\n                iStep := 11;\n            END_IF\n        END_IF\n    11: IF xB1_Flanke THEN iStep := 1; END_IF\nEND_CASE\n\n(* Schrittverriegelungen*)\nxK1          := (iStep = 7) OR (iStep = 8);\nxK2          := (iStep = 5) OR (iStep = 11);\nxK3          := (iStep = 5) OR (iStep = 10) OR (iStep = 11);\nxK5          := (iStep = 3);\nxK7          := (iStep = 4);\nxA1          := (iStep = 7);\nxA2          := (iStep = 8);\nxA3          := (iStep = 6);\nxA4          := (iStep = 9);\nxAbtransport := (iStep = 10);\nEND_PROGRAM\n\n\nPROGRAM PRG_Ausgaenge\nVAR_INPUT\n    xFreigabe : BOOL;\nEND_VAR\n\nROLLE_1          := xFreigabe AND SFC_Saege.xK2 AND E3;\nROLLE_2          := xFreigabe AND SFC_Saege.xK3;\nSPANNEN          := xFreigabe AND SFC_Saege.xA3 AND NOT SFC_Saege.xA4;\nENTSPANNEN       := xFreigabe AND SFC_Saege.xA4 AND E4;\nSAEGE_ANTRIEB    := xFreigabe AND SFC_Saege.xK1 AND E2;\nSAEGE_RUNTER     := xFreigabe AND SFC_Saege.xA1 AND E2 AND NOT SFC_Saege.xA2;\nSAEGE_HOCH       := xFreigabe AND SFC_Saege.xA2;\nANSCHLAG1_HOCH   := xFreigabe AND SFC_Saege.xAbtransport AND SFC_Saege.xDuenn;\nANSCHLAG2_HOCH   := xFreigabe AND SFC_Saege.xAbtransport AND SFC_Saege.xDick;\nANSCHLAG1_RUNTER := xFreigabe AND SFC_Saege.xK5 AND NOT ANSCHLAG1_HOCH;\nANSCHLAG2_RUNTER := xFreigabe AND SFC_Saege.xK7 AND NOT ANSCHLAG2_HOCH;\nEND_PROGRAM\n\n\nPROGRAM PLC_PRG\nVAR\n    fbBetriebsart : FB_Betriebsart;\n    rtB1          : R_TRIG;\nEND_VAR\n\nfbBetriebsart();\nrtB1(CLK := WST_ABTRANSPORT);\n\nSFC_Saege(xAuto := fbBetriebsart.xAuto, xB1_Flanke := rtB1.Q, xReset := NOT fbBetriebsart.xEin);\n\nPRG_Ausgaenge(xFreigabe := fbBetriebsart.xEin AND NOT fbBetriebsart.xStoerung);\nEND_PROGRAM\n","model":"(* ============================================================\n   Anlagenmodell Rohrsäge  –  läuft im Simulator in jedem Zyklus\n   VOR dem SPS-Programm und bildet die Sensoren (E0..E15, B1)\n   aus den Ausgängen (A1..A4, K1..K7) nach.\n\n   Geometrie (mm, ab Sägeblatt):  Anschlag 1 = 300, Anschlag 2 = 500,\n   Lichtschranke B1 = 1500.  Rohrlänge 1700 mm.\n   ============================================================ *)\n\nPROGRAM SIM_Saege\nVAR_INPUT\n    xNaechstesDick : BOOL := FALSE;   (* Typ des nächsten Rohres *)\n    xNachladen     : BOOL := TRUE;    (* automatisch neues Rohr auflegen *)\nEND_VAR\nVAR_OUTPUT\n    iSchnitte      : INT;             (* Anzahl Schnitte gesamt *)\n    iAbtransport   : INT;             (* Teile, die die Anlage verlassen haben *)\n    iRohre         : INT;             (* aufgelegte Rohre *)\n    xKollision     : BOOL;            (* mechanische Kollision erkannt *)\n    sKollision     : STRING;\nEND_VAR\nVAR CONSTANT\n    POS_A1   : REAL := 300.0;\n    POS_A2   : REAL := 500.0;\n    POS_B1   : REAL := 1500.0;\n    ROHR_LEN : REAL := 1700.0;\n    V_ROLLE  : REAL := 0.5;     (* mm/ms *)\n    V_SAEGE  : REAL := 0.1;     (* %/ms  -> 1 s Hub *)\n    V_SPANN  : REAL := 0.4;     (* %/ms  -> 250 ms *)\n    V_ANSCHL : REAL := 0.25;    (* %/ms  -> 400 ms *)\n    MAX_TEILE : INT := 8;\nEND_VAR\nVAR\n    xInit      : BOOL;\n    tLast      : TIME;\n    dt         : REAL;\n    rSaege     : REAL := 100.0;  (* 100 = oben, 0 = unten *)\n    rSpann     : REAL := 0.0;    (* 0 = entspannt, 100 = gespannt *)\n    rAnschlag1 : REAL := 0.0;    (* 0 = oben, 100 = unten *)\n    rAnschlag2 : REAL := 0.0;\n    xRohrDick  : BOOL;\n    rRohrFront : REAL;           (* Rohranfang hinter dem Sägeblatt *)\n    rRohrLen   : REAL;           (* Restlänge auf der Zuführung *)\n    aFront     : ARRAY[1..8] OF REAL;   (* abgesägte Teile auf Rollenbahn 2 *)\n    aLen       : ARRAY[1..8] OF REAL;\n    nTeile     : INT;\n    xGeschnitten : BOOL;\n    tonLaden   : TON;\n    i, k       : INT;\n    rWeg, rHinten : REAL;\nEND_VAR\n\n(* ---------- Initialisierung beim ersten Zyklus ---------- *)\nIF NOT xInit THEN\n    xInit := TRUE;\n    tLast := TIME();\n    E9 := TRUE;  E11 := TRUE;   (* Öffner nicht betätigt *)\n    mot_schutz_saege := TRUE;  mot_schutz_rolle1 := TRUE;  mot_schutz_rolle2 := TRUE;\n    mot_schutz_anschlag1 := TRUE;  mot_schutz_anschlag2 := TRUE;\nEND_IF\ndt := TIME_TO_REAL(TIME() - tLast);\ntLast := TIME();\n\n(* ---------- Säge ---------- *)\nIF SAEGE_RUNTER AND NOT SAEGE_HOCH THEN\n    rSaege := MAX(0.0, rSaege - V_SAEGE * dt);\nELSIF SAEGE_HOCH AND NOT SAEGE_RUNTER THEN\n    rSaege := MIN(100.0, rSaege + V_SAEGE * dt);\nEND_IF\nIF rSaege < 60.0 AND rRohrLen > 0.0 AND NOT SAEGE_ANTRIEB AND NOT xKollision THEN\n    xKollision := TRUE;  sKollision := 'Säge fährt ohne Antrieb ins Rohr';\nEND_IF\nIF rSaege < 60.0 AND rRohrLen > 0.0 AND rSpann < 100.0 AND NOT xKollision THEN\n    xKollision := TRUE;  sKollision := 'Sägen ohne gespanntes Rohr';\nEND_IF\n\n(* ---------- Spannbacken ---------- *)\nIF SPANNEN AND NOT ENTSPANNEN THEN\n    rSpann := MIN(100.0, rSpann + V_SPANN * dt);\nELSIF ENTSPANNEN AND NOT SPANNEN THEN\n    rSpann := MAX(0.0, rSpann - V_SPANN * dt);\nEND_IF\n\n(* ---------- Längenanschläge ---------- *)\nIF ANSCHLAG1_RUNTER AND NOT ANSCHLAG1_HOCH THEN rAnschlag1 := MIN(100.0, rAnschlag1 + V_ANSCHL * dt);\nELSIF ANSCHLAG1_HOCH AND NOT ANSCHLAG1_RUNTER THEN rAnschlag1 := MAX(0.0, rAnschlag1 - V_ANSCHL * dt); END_IF\nIF ANSCHLAG2_RUNTER AND NOT ANSCHLAG2_HOCH THEN rAnschlag2 := MIN(100.0, rAnschlag2 + V_ANSCHL * dt);\nELSIF ANSCHLAG2_HOCH AND NOT ANSCHLAG2_RUNTER THEN rAnschlag2 := MAX(0.0, rAnschlag2 - V_ANSCHL * dt); END_IF\n\n(* Anschlag fährt auf ein Teil, das unter ihm liegt? *)\nFOR i := 1 TO nTeile DO\n    rHinten := aFront[i] - aLen[i];\n    IF ANSCHLAG1_RUNTER AND rHinten < POS_A1 - 1.0 AND aFront[i] > POS_A1 + 1.0 AND NOT xKollision THEN\n        xKollision := TRUE;  sKollision := 'Anschlag 1 fährt auf ein Teil';\n    END_IF\n    IF ANSCHLAG2_RUNTER AND rHinten < POS_A2 - 1.0 AND aFront[i] > POS_A2 + 1.0 AND NOT xKollision THEN\n        xKollision := TRUE;  sKollision := 'Anschlag 2 fährt auf ein Teil';\n    END_IF\nEND_FOR\n\nIF ANSCHLAG1_RUNTER AND rRohrLen > 0.0 AND rRohrFront > POS_A1 + 1.0 AND NOT xKollision THEN\n    xKollision := TRUE;  sKollision := 'Anschlag 1 fährt auf das Rohr';\nEND_IF\nIF ANSCHLAG2_RUNTER AND rRohrLen > 0.0 AND rRohrFront > POS_A2 + 1.0 AND NOT xKollision THEN\n    xKollision := TRUE;  sKollision := 'Anschlag 2 fährt auf das Rohr';\nEND_IF\n\n(* ---------- Rohr auf der Zuführung (Rollenbahn 1) ---------- *)\nIF ROLLE_1 AND rRohrLen > 0.0 THEN\n    IF rSpann > 0.0 THEN\n        IF NOT xKollision THEN xKollision := TRUE; sKollision := 'Vorschub gegen gespanntes Rohr'; END_IF\n    ELSE\n        rWeg := V_ROLLE * dt;\n        rRohrFront := rRohrFront + rWeg;\n        IF rAnschlag1 > 0.0 AND rRohrFront - rWeg <= POS_A1 + 0.01 THEN rRohrFront := MIN(rRohrFront, POS_A1); END_IF\n        IF rAnschlag2 > 0.0 AND rRohrFront - rWeg <= POS_A2 + 0.01 THEN rRohrFront := MIN(rRohrFront, POS_A2); END_IF\n        (* Rohrende hat die Säge passiert -> Reststück auf Rollenbahn 2 *)\n        IF rRohrFront >= rRohrLen AND nTeile < MAX_TEILE THEN\n            nTeile := nTeile + 1;\n            aFront[nTeile] := rRohrFront;  aLen[nTeile] := rRohrLen;\n            rRohrLen := 0.0;  rRohrFront := 0.0;\n        END_IF\n    END_IF\nEND_IF\n\n(* ---------- Schnitt ---------- *)\nIF SAEGE_ANTRIEB AND rSaege <= 0.0 AND rSpann >= 100.0 AND NOT xGeschnitten AND rRohrFront > 0.0 AND nTeile < MAX_TEILE THEN\n    xGeschnitten := TRUE;\n    iSchnitte := iSchnitte + 1;\n    nTeile := nTeile + 1;\n    aFront[nTeile] := rRohrFront;  aLen[nTeile] := rRohrFront;\n    rRohrLen := rRohrLen - rRohrFront;\n    rRohrFront := 0.0;\nEND_IF\nIF rSaege >= 100.0 THEN xGeschnitten := FALSE; END_IF\n\n(* ---------- Teile auf Rollenbahn 2 ---------- *)\nIF ROLLE_2 THEN\n    rWeg := V_ROLLE * dt;\n    FOR i := 1 TO nTeile DO\n        aFront[i] := aFront[i] + rWeg;\n        IF rAnschlag1 > 0.0 AND aFront[i] - rWeg <= POS_A1 + 0.01 THEN aFront[i] := MIN(aFront[i], POS_A1); END_IF\n        IF rAnschlag2 > 0.0 AND aFront[i] - rWeg <= POS_A2 + 0.01 THEN aFront[i] := MIN(aFront[i], POS_A2); END_IF\n    END_FOR\nEND_IF\n(* Teile, die die Rollenbahn verlassen haben, entfernen *)\ni := 1;\nWHILE i <= nTeile DO\n    IF aFront[i] - aLen[i] > POS_B1 + 300.0 THEN\n        FOR k := i TO nTeile - 1 DO\n            aFront[k] := aFront[k + 1];  aLen[k] := aLen[k + 1];\n        END_FOR\n        nTeile := nTeile - 1;\n        iAbtransport := iAbtransport + 1;\n    ELSE\n        i := i + 1;\n    END_IF\nEND_WHILE\n\n(* ---------- Rohr nachladen ---------- *)\ntonLaden(IN := xNachladen AND rRohrLen <= 0.0 AND NOT ROLLE_1, PT := T#1s);   (* Werker legt nur bei stehender Bahn auf *)\nIF tonLaden.Q THEN\n    rRohrLen := ROHR_LEN;  rRohrFront := 0.0;\n    xRohrDick := xNaechstesDick;\n    iRohre := iRohre + 1;\nEND_IF\n\n(* ---------- Sensoren ---------- *)\nE0  := rRohrLen > 0.0 AND rAnschlag1 >= 100.0 AND rRohrFront >= POS_A1 - 0.5;\nE1  := rRohrLen > 0.0 AND rAnschlag2 >= 100.0 AND rRohrFront >= POS_A2 - 0.5;\nE2  := rSpann >= 100.0;\nE3  := rSpann <= 0.0;\nE4  := rSaege >= 100.0;\nE5  := rSaege <= 0.0;\nE6  := rAnschlag1 <= 0.0;\nE7  := rAnschlag1 >= 100.0;\nE12 := rAnschlag2 <= 0.0;\nE13 := rAnschlag2 >= 100.0;\nE14 := rRohrLen > 0.0 AND xRohrDick;\nE15 := rRohrLen > 0.0 AND NOT xRohrDick;\nWST_ABTRANSPORT := FALSE;\nFOR i := 1 TO nTeile DO\n    IF aFront[i] >= POS_B1 AND aFront[i] - aLen[i] <= POS_B1 THEN WST_ABTRANSPORT := TRUE; END_IF\nEND_FOR\nEND_PROGRAM\n","tests":"(* ============================================================\n   Integrationstests: Saege_CODESYS.st + Anlagenmodell Saege_Anlage.st\n   Die Sensoren kommen hier aus dem Modell (SIM_Saege).\n   CLI:  node st-test.js Saege_CODESYS.st --model Saege_Anlage.st Saege_Integration.sttest\n   ============================================================ *)\n\nTEST 'Dünnes Rohr: 4 Teile à 300 mm, Reststück, Grundstellung'\n    SIM_Saege.xNaechstesDick := FALSE;\n    WAIT T#1100ms;                       (* Rohr wird aufgelegt *)\n    ASSERT E15 AND NOT E14;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    E11 := FALSE; CYCLE; E11 := TRUE;    (* STOPP: nur dieses eine Rohr *)\n    RUN_UNTIL SFC_Saege.iStep = 11 TIMEOUT T#60s;\n    ASSERT SIM_Saege.iSchnitte = 4;\n    RUN_UNTIL SFC_Saege.iStep = 1 TIMEOUT T#10s;\n    ASSERT NOT SIM_Saege.xKollision, SIM_Saege.sKollision;\n    LOG 'Rohr fertig nach', TIME();\nEND_TEST\n\n\nTEST 'Dickes Rohr: 3 Teile à 500 mm über Anschlag 2'\n    SIM_Saege.xNaechstesDick := TRUE;\n    WAIT T#1100ms;\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    E11 := FALSE; CYCLE; E11 := TRUE;\n    RUN_UNTIL SFC_Saege.iStep = 4 TIMEOUT T#1s;\n    RUN_UNTIL SFC_Saege.iStep = 11 TIMEOUT T#60s;\n    ASSERT SIM_Saege.iSchnitte = 3;\n    RUN_UNTIL SFC_Saege.iStep = 1 TIMEOUT T#10s;\n    ASSERT NOT SIM_Saege.xKollision, SIM_Saege.sKollision;\nEND_TEST\n\n\nTEST 'Dauerbetrieb: 3 dünne Rohre ohne Kollision'\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    WAIT T#1100ms;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    RUN_UNTIL SIM_Saege.iSchnitte = 12 OR SIM_Saege.xKollision TIMEOUT T#3m;\n    ASSERT NOT SIM_Saege.xKollision, SIM_Saege.sKollision;\n    LOG 'Zeit für 12 Schnitte:', TIME(), ' Rohre:', SIM_Saege.iRohre;\nEND_TEST\n\n\nTEST 'Säge läuft nur, wenn das Rohr gespannt ist'\nVAR n : DINT; END_VAR\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    WAIT T#1100ms;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    FOR n := 1 TO 6000 DO          (* 60 s Zyklus für Zyklus überwachen *)\n        CYCLE;\n        ASSERT NOT SAEGE_ANTRIEB OR E2, 'Sägeantrieb ohne gespanntes Rohr';\n        ASSERT NOT (ROLLE_1 AND SPANNEN), 'Vorschub während Spannen';\n        ASSERT NOT (SAEGE_RUNTER AND SAEGE_HOCH);\n    END_FOR\nEND_TEST\n\n\nTEST 'AUS mitten im Sägen: alles stoppt sofort'\n    E8 := TRUE;  CYCLE;  E8 := FALSE;\n    WAIT T#1100ms;\n    E10 := TRUE; CYCLE;  E10 := FALSE;\n    RUN_UNTIL SFC_Saege.iStep = 7 TIMEOUT T#20s;\n    WAIT T#300ms;\n    E9 := FALSE;  CYCLE;\n    ASSERT NOT (SAEGE_ANTRIEB OR SAEGE_RUNTER OR ROLLE_1 OR ROLLE_2);\n    ASSERT SFC_Saege.iStep = 1;\nEND_TEST\n","modelOn":true,"files":{"prog":"Saege_CODESYS.st","model":"Saege_Anlage.st","tests":"Saege_Integration.sttest"}},{"name":"Sprachumfang (Selbsttest)","prog":"TYPE E_Mode : (IDLE, RUN := 5, ERR); END_TYPE\nTYPE ST_Pt : STRUCT x : INT := 3; y : REAL; END_STRUCT END_TYPE\n\nVAR_GLOBAL\n  gIn : BOOL;\n  gCnt : INT;\n  gArr : ARRAY[1..5] OF INT := [1, 2, 3(7)];\n  gMode : E_Mode;\n  gW : WORD := 16#00F0;\n  gT : TIME;\nEND_VAR\nVAR_GLOBAL CONSTANT\n  N : INT := 5;\nEND_VAR\n\nFUNCTION Add3 : INT\nVAR_INPUT a, b : INT; c : INT := 100; END_VAR\nAdd3 := a + b + c;\nEND_FUNCTION\n\nFUNCTION_BLOCK FB_Blink\nVAR_INPUT en : BOOL; tOn : TIME := T#100ms; END_VAR\nVAR_OUTPUT q : BOOL; END_VAR\nVAR t1, t2 : TON; END_VAR\nt1(IN := en AND NOT t2.Q, PT := tOn);\nt2(IN := t1.Q, PT := tOn);\nq := t1.Q;\nEND_FUNCTION_BLOCK\n\nPROGRAM PLC_PRG\nVAR\n  i, sum : INT;\n  overflow : INT := 32767;\n  r : REAL;\n  p : ST_Pt;\n  blink : FB_Blink;\n  ton1 : TON;\n  ctu1 : CTU;\n  rt : R_TRIG;\n  s : STRING := 'abc';\n  div : INT := 7;\n  bits : BYTE;\n  m2 : ARRAY[0..2, 0..1] OF DINT;\n  res : INT;\nEND_VAR\nsum := 0;\nFOR i := 1 TO N DO\n  IF i = 4 THEN CONTINUE; END_IF\n  sum := sum + gArr[i];\nEND_FOR\noverflow := overflow + 1;\nr := INT_TO_REAL(div) / 2;\ndiv := 7 / 2;\nres := Add3(1, 2) + Add3(a := 1, b := 1, c := 1);\ns := CONCAT(s, 'def');\nbits := SHL(BYTE#1, 3) OR 2#1;\ngW.0 := TRUE;\nm2[2, 1] := 42;\ngMode := E_Mode.RUN;\np.y := p.x * 1.5;\nblink(en := gIn);\nton1(IN := gIn, PT := T#1s);\nrt(CLK := gIn);\nctu1(CU := gIn, PV := 3);\nIF rt.Q THEN gCnt := gCnt + 1; END_IF\ngT := ton1.ET;\nCASE gCnt OF\n  0: ;\n  1..2: i := 100;\nELSE\n  i := -1;\nEND_CASE\nWHILE i < 105 DO i := i + 1; IF i = 103 THEN EXIT; END_IF END_WHILE\nEND_PROGRAM\n","model":"","tests":"TEST 'Arithmetik und Typen'\n  CYCLE;\n  ASSERT PLC_PRG.sum = 1 + 2 + 7 + 7;  (* i=4 per CONTINUE übersprungen *)\n  ASSERT PLC_PRG.overflow = -32768, 'INT-Überlauf';\n  ASSERT PLC_PRG.r = 3.5;\n  ASSERT PLC_PRG.div = 3;\n  ASSERT PLC_PRG.res = 103 + 3;\n  ASSERT PLC_PRG.s = 'abcdef';\n  ASSERT PLC_PRG.bits = 9;\n  ASSERT gW = 16#F1;\n  ASSERT PLC_PRG.m2[2,1] = 42;\n  ASSERT gMode = E_Mode.RUN;\n  ASSERT gMode = RUN;\n  ASSERT PLC_PRG.p.y = 4.5;\n  ASSERT PLC_PRG.i = 103;\nEND_TEST\n\nTEST 'Timer und Flanken'\n  gIn := TRUE;\n  CYCLE;\n  ASSERT gCnt = 1;\n  ASSERT ton1.Q = FALSE;\n  WAIT T#990ms;\n  ASSERT ton1.Q = FALSE;\n  CYCLE;\n  ASSERT ton1.Q;\n  ASSERT gCnt = 1;\n  ASSERT PLC_PRG.i = 103;\n  gIn := FALSE; CYCLE; gIn := TRUE; CYCLE; gIn := FALSE; CYCLE; gIn := TRUE; CYCLE;\n  ASSERT ctu1.Q AND ctu1.CV = 3;\nEND_TEST\n\nTEST 'Blinker'\nVAR n : INT; last : BOOL; END_VAR\n  gIn := TRUE;\n  FOR n := 1 TO 100 DO\n    CYCLE;\n    IF blink.q <> last THEN sum := sum + 1; END_IF\n    last := blink.q;\n  END_FOR\n  LOG 'Flanken', n;\n  RUN_UNTIL blink.q TIMEOUT T#500ms;\nEND_TEST\n\n","modelOn":false,"files":{"prog":"features.st","model":"anlage.st","tests":"features.sttest"}}];
